<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B6A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gitara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gitaros pratybos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, fixed bottom tab bar, four views (Šiandien / Tikslai / Teorija / Metronomas) */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --line:#D5DDD8; --fg:#16201B; --muted:#58675F;
  --accent:#2B6A4C; --accent-ink:#FFFFFF; --brass:#9A6F12; --brass-soft:#F4E9CF; --done:#2B6A4C; --warn:#A5461F;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#17201B; --line:#2A362F; --fg:#E6EDE8; --muted:#94A49B;
  --accent:#6CC297; --accent-ink:#0E1411; --brass:#E2B54F; --brass-soft:#2E2715; --done:#6CC297; --warn:#F08A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#17201B; --line:#2A362F; --fg:#E6EDE8; --muted:#94A49B;
  --accent:#6CC297; --accent-ink:#0E1411; --brass:#E2B54F; --brass-soft:#2E2715; --done:#6CC297; --warn:#F08A5D; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:6px;padding-block:4px 14px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* fretboard progress strip: 14 frets = 14 days of the stage */
.fret{display:grid;grid-template-columns:repeat(14,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.fret span{height:26px;border-right:2px solid var(--line);position:relative}
.fret span:last-child{border-right:0}
.fret span.on::after{content:"";position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.fret span.today{background:var(--brass-soft)}
.fret span.inlay::before{content:"";position:absolute;left:50%;bottom:2px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--muted);opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.78rem}

/* exercises */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ex[open]{border-color:var(--accent)}
.ex summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.ex summary::-webkit-details-marker{display:none}
.chk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--accent-ink)}
.ex.done .chk{background:var(--done);border-color:var(--done)}
.ex.done .chk::after{content:"✓";font-weight:700}
.ex .t{flex:1;min-width:0}
.ex .t h3{font-size:1rem}
.ex.done .t h3{color:var(--muted)}
.ex .min{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ex .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:5.2ch}
.clock.run{color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brass-soft);color:var(--brass)}

/* goals */
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.goal input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.goal label{flex:1;min-width:0}
.road{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px}
.road li{list-style:none;position:relative;padding:0 0 14px 18px}
.road li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.road li.past::before{background:var(--done);border-color:var(--done)}
.road li.cur::before{background:var(--brass);border-color:var(--brass)}
.road ul{padding:0;margin:0}
.note{background:var(--brass-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* theory */
.theory{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:65ch}
.theory code,.theory .k{font-family:var(--f-mono);font-size:.92em;background:var(--bg);padding:1px 5px;border-radius:4px}
.scale{display:flex;flex-wrap:wrap;gap:4px}
.scale span{font-family:var(--f-mono);font-size:.85rem;padding:4px 7px;border-radius:6px;border:1px solid var(--line)}
.scale span.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.other{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.other summary{cursor:pointer;font-weight:700}

/* metronome */
.metro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px;align-items:center}
.bpm{font-family:var(--f-mono);font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.beats{display:flex;gap:10px}
.beats i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.beats i.on{background:var(--accent);border-color:var(--accent)}
.beats i.on.first{background:var(--brass);border-color:var(--brass)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:none;padding:10px 1px 12px;font-size:.68rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;max-width:90vw}
.target{font-family:var(--f-display);font-size:5rem;font-weight:700;line-height:1;transition:transform .2s,color .2s}
.target.ok{color:var(--done);transform:scale(1.15)}
.strlabel{font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--brass)}
.heard{font-weight:700;min-height:1.5em;color:var(--muted)}.heard.good{color:var(--done)}.heard.bad{color:var(--warn)}
.wrongtag{font-weight:700;color:var(--warn)}
.hm-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.hm{border-collapse:collapse;font-family:var(--f-mono);font-size:.72rem;width:100%;min-width:420px}
.hm th{color:var(--muted);font-weight:500;padding:4px 2px}
.hm td{text-align:center;padding:6px 1px;border-left:2px solid var(--line);color:var(--muted)}
.hm tr.off td{opacity:.35}
.hm td.good{background:color-mix(in srgb,var(--done) 30%,transparent);color:var(--fg)}
.hm td.mid{background:color-mix(in srgb,var(--brass) 30%,transparent);color:var(--fg)}
.hm td.slow{background:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--fg)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:middle}
.lg.good{background:var(--done)}.lg.mid{background:var(--brass)}.lg.slow{background:var(--warn)}
table.res{border-collapse:collapse;width:100%;font-size:.9rem}
.res th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.eopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.eopt{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.eopt small{font-weight:400;color:var(--muted);font-size:.78rem;text-align:center}
.eopt.right{border-color:var(--done);background:color-mix(in srgb,var(--done) 18%,var(--surface))}
.eopt.wrongb{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.efb{text-align:center;min-height:1.5em}.efb.good{color:var(--done)}.efb.bad{color:var(--warn)}
.efb .muted{font-size:.88rem}
.btn.play{font-size:1.15rem;min-width:200px;min-height:56px;border-radius:14px}
.drill{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--bg);border-radius:12px;padding:14px}
.drill .target{font-size:4rem}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;text-align:left}
.tips{margin:0;padding-left:18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.rbeats i.on{background:var(--accent);border-color:var(--accent)}
.rbeats i.on.first{background:var(--brass);border-color:var(--brass)}
.calb{display:flex;flex-direction:column;align-items:center;min-width:58px;gap:0}
.calb small{font-family:var(--f-mono);font-size:.72rem;font-weight:500}
.calb.okc{border-color:var(--done);color:var(--done)}
.calb.warnc{border-color:var(--brass);color:var(--brass)}
.calb.live{background:var(--brass-soft)}
.recs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.recs summary{cursor:pointer;list-style:none}
.recs summary::-webkit-details-marker{display:none}
.recs ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.recs li{display:flex;flex-direction:column;gap:3px;padding-top:10px;border-top:1px solid var(--line)}
.recs li .btn{align-self:flex-start;margin-top:4px}
.scgrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.scgrid span{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;min-width:52px}
.scgrid span.okc{border-color:var(--done);color:var(--done)}
.scgrid span.warnc{border-color:var(--warn);color:var(--warn)}
.fgbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.fgt{font-family:var(--f-display);font-size:3.4rem;font-weight:700;line-height:1}
.fgs{font-size:1.8rem;font-weight:700;line-height:1.1}
.fb{display:grid;grid-template-columns:30px repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px 6px;user-select:none;-webkit-user-select:none}
.fbh{text-align:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:2px 0 4px}
.fbn{display:flex;align-items:center;justify-content:center;gap:2px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border-bottom:2px solid transparent}
.fbn i{font-style:normal;color:var(--brass);font-size:.9rem}
.fbc{position:relative;height:34px;border:0;border-bottom:2px solid var(--line);padding:0;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(to right,transparent calc(50% - var(--sw)/2),var(--muted) calc(50% - var(--sw)/2),var(--muted) calc(50% + var(--sw)/2),transparent calc(50% + var(--sw)/2))}
.fgstr{display:block;font-size:1.1rem;color:var(--brass);margin-top:4px}
.fbc.tcol{background-color:var(--brass-soft)}
.fbh.tcolh{color:var(--brass);font-weight:700}
.fbc.open{border-bottom:5px solid var(--fg)}
.fbc.off{opacity:.3;cursor:default}
.fbc span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:700;padding:0 3px}
.fbc span:not(:empty){background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.fbc.good span{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.fbc.bad span{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.fbc.show span{background:var(--brass);border-color:var(--brass);color:var(--surface)}
.fbc:active:not(.off){background-color:var(--brass-soft)}
.res td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <section id="v-today" class="stack"></section>
  <section id="v-goals" class="stack" hidden></section>
  <section id="v-theory" class="stack" hidden></section>
  <section id="v-metro" class="stack" hidden></section>
  <section id="v-ear" class="stack" hidden></section>
  <section id="v-ear2" class="stack" hidden></section>
  <section id="v-cal" class="stack" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<nav class="tabs" role="tablist">
  <button role="tab" data-v="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Šiandien</button>
  <button role="tab" data-v="goals" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Tikslai</button>
  <button role="tab" data-v="theory" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Teorija</button>
  <button role="tab" data-v="metro" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 3h8l4 18H4zM12 17l5-11M7 15h10"/></svg>Tempas</button>
  <button role="tab" data-v="ear" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 10h18M3 14h18M3 18h18M8 4v16M14 4v16"/><circle cx="11" cy="12" r="2" fill="currentColor"/></svg>Grifas</button>
  <button role="tab" data-v="ear2" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 3-2 4-3 5.5S14 18 12 19.5 8 21 7 19"/><path d="M10 9a2 2 0 1 1 4 0c0 1.5-2 2-2 3.5"/></svg>Klausa</button>
</nav>

<script>
"use strict";
const NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function scaleRow(hl){return '<div class="scale">'+NOTES.map(n=>'<span class="'+(hl.includes(n)?'hl':'')+'">'+n+'</span>').join('')+'</div>';}

const PHASES=[
{title:"Pirštų sugrįžimas ir grifas",
 focus:"Grąžiname pirštams jėgą ir išmokstame, kur gitaroje yra natos.",
 theory:`<h3>12 natų</h3><p>Muzikoje yra tik 12 skirtingų garsų. Jie kartojasi vis aukščiau (oktavomis):</p>${scaleRow(["C","D","E","F","G","A","B"])}
 <p>Atstumas tarp dviejų gretimų garsų yra <b>pustonis</b>. Du pustoniai yra <b>tonas</b>. Tarp <span class="k">E–F</span> ir <span class="k">B–C</span> nėra diezo, ten tik pustonis.</p>
 <h3>Gitaroje</h3><p>Viena skersinė (ladas) = vienas pustonis. Atviros stygos nuo storiausios: <span class="k">E A D G B E</span>. 12-oje skersinėje natos pradeda kartotis iš naujo.</p>
 <p>Pavyzdys 6 stygoje: 0 E, 1 F, 3 G, 5 A, 7 B, 8 C, 10 D, 12 E.</p>
 <h3>Ritmas</h3><p>Groti pagal metronomą reiškia vieną smūgį ar natą vienam tvaksniui. Skaičiuokite garsiai: <span class="k">1 2 3 4</span>.</p>
 <h3>Kaip įsiminti natas</h3><p>Mokykitės po vieną stygą, kiekvienai skirkite 3–5 dienas. Pirmiausia įsiminkite orientyrus: atvira styga, 5, 7 ir 12 skersinės. 6 stygoje tai E, A, B, E, o 5 stygoje A, D, E, A. Kitas natas skaičiuokite nuo artimiausio orientyro, kol jos įsimins pačios.</p>
 <p class="muted">Pirmomis dienomis pirštų galiukai skaudės, tai normalu. Geriau 2 trumpos sesijos per dieną nei viena ilga.</p>`,
 ex:[
  {id:"warm",n:"Apšilimas",m:2,h:"Pagniaužykite kumštį, patempkite pirštus atgal, pakratykite riešus. Pečiai atpalaiduoti."},
  {id:"chrom",n:"Chromatinis 1-2-3-4",m:5,bpm:60,h:"Kiekvienoje stygoje paspauskite 1, 2, 3, 4 skersines 1, 2, 3, 4 pirštais, nuo 6 stygos iki 1 ir atgal. Viena nata vienam tvaksniui. Pirštai arti stygų, spausti tik tiek, kad skambėtų švariai."},
  {id:"notes65",n:"Natos 6 ir 5 stygoje",m:4,drill:true,h:"Mokomės po vieną stygą. Paspauskite „Pradėti“: programėlė atsitiktine tvarka rodys natą šioje stygoje. Suraskite ir sugrokite ją, sakydami pavadinimą garsiai. Mikrofonas patikrins, ar nata teisinga, ir pamatuos laiką."},
  {id:"emam",n:"Akordai Em ir Am",m:5,bpm:60,changes:[["Em","Am"]],h:"Išmokite pirštuotę. Tada grokite po 4 smūgius žemyn kiekvienam akordui pagal metronomą. Pirmiausia tikrinkite, ar skamba visos stygos."},
  {id:"min1",n:"Vienos minutės keitimai",m:1,changes:[["Em","Am"]],h:"Per minutę keiskite Em ↔ Am kuo daugiau kartų, bet švariai: po kiekvieno keitimo vieną kartą užgaukite visas stygas. Programėlė skaičiuoja keitimus ir mikrofonu tikrina, ar suskambo visos akordo natos."}
 ],
 goals:["Chromatinis pratimas visose stygose švariai 60 bpm","Bet kurią natą 6 ir 5 stygoje randu negalvodamas: su gitara iki 2 s, ekrano žaidime iki 1 s","Em ↔ Am: 30 švarių keitimų per minutę","Galiu paaiškinti, kas yra pustonis ir tonas, ir kur nėra diezų"]},

{title:"Majorinė gama ir atviri akordai",
 focus:"Suprantame, kaip sudaroma gama, ir išmokstame pagrindinius akordus.",
 theory:`<h3>Gama yra formulė</h3><p><b>Majorinė gama</b> sudaroma pagal žingsnius: <span class="k">T T P T T T P</span> (T tonas, P pustonis).</p>
 <p>Nuo C gaunasi C D E F G A B C, be jokių diezų:</p>${scaleRow(["C","D","E","F","G","A","B"])}
 <p>Nuo G: G A B C D E <b>F#</b> G. Formulė priverčia F pakelti į F#.</p>${scaleRow(["G","A","B","C","D","E","F#"])}
 <h3>Laipsniai</h3><p>Gamos natos numeruojamos 1–7. C majore 1 = C, 3 = E, 5 = G. Šie numeriai bus raktas į akordus kitame etape.</p>
 <h3>Ritmas</h3><p>Aštuntinės: du smūgiai vienam tvaksniui. Skaičiuokite <span class="k">1 ir 2 ir 3 ir 4 ir</span>: ant skaičių žemyn, ant „ir“ aukštyn.</p>`,
 ex:[
  {id:"warm",n:"Apšilimas",m:2,h:"Kaip ir anksčiau, plius 1 ratas chromatinio pratimo be metronomo."},
  {id:"chrom",n:"Chromatinis 1-2-3-4",m:3,bpm:70,h:"Dabar 70 bpm. Jei švaru, pabandykite aštuntinėmis 50 bpm."},
  {id:"scale1",n:"C majoras vienoje stygoje",m:4,h:"2 (B) styga: pradėkite nuo 1 skersinės (C) ir eikite pagal T T P T T T P iki 13 skersinės. Sakykite natų pavadinimus."},
  {id:"scaleopen",n:"C majoras pirmoje pozicijoje",m:4,bpm:60,h:"5 st. 3 sk. (C), 4 st. 0, 2, 3 (D E F), 3 st. 0, 2 (G A), 2 st. 0, 1 (B C). Aukštyn ir žemyn, viena nata vienam tvaksniui."},
  {id:"cgd",n:"Akordai C, G, D",m:5,bpm:70,changes:[["G","C"],["C","D"],["G","D"]],h:"Keitimai G ↔ C, C ↔ D, G ↔ D. Ritmas aštuntinėmis žemyn-aukštyn. Atlikite ir vienos minutės keitimų testą G ↔ C."},
  {id:"prog1",n:"Progresija G–C–D–Em",m:4,bpm:70,h:"Po vieną taktą (4 tvaksniai) kiekvienam akordui. Nesustokite, net jei suklystate. Ritmas svarbiau už tobulą akordą."}
 ],

{title:"Intervalai ir kaip gimsta akordai",
 focus:"Suprantame, iš ko sudarytas akordas, ir kodėl dainose kartojasi tie patys akordai.",
 theory:`<h3>Intervalai</h3><p>Intervalas yra atstumas tarp dviejų natų pustoniais: <b>mažoji tercija</b> 3, <b>didžioji tercija</b> 4, <b>grynoji kvinta</b> 7, <b>oktava</b> 12.</p>
 <h3>Trigarsis = 1, 3, 5</h3><p>Akordas yra gamos 1, 3 ir 5 natos. <b>Majorinis</b>: didžioji tercija + mažoji (C E G). <b>Minorinis</b>: mažoji + didžioji (A C E). Majoras skamba šviesiai, minoras liūdniau.</p>${scaleRow(["C","E","G"])}
 <h3>Tonacijos akordai</h3><p>Ant kiekvienos gamos natos statome trigarsį, naudodami tik gamos natas. C majore gaunasi:</p>
 <p><span class="k">I C · ii Dm · iii Em · IV F · V G · vi Am · vii° Bdim</span></p>
 <p>Labai daug populiarių dainų naudoja <b>I–V–vi–IV</b>: C majore tai C–G–Am–F, G majore G–D–Em–C.</p>
 <h3>Ritmas</h3><p>Populiarus piešinys: <span class="k">Ž Ž A A Ž A</span> (Ž žemyn, A aukštyn), skaičiuojant <span class="k">1 2 ir (3) ir 4 ir</span>.</p>`,
 ex:[
  {id:"warm",n:"Apšilimas",m:2,h:"Chromatinis ratas ir pirštų tempimas."},
  {id:"intv",n:"Intervalai ant grifo",m:4,h:"Nuo bet kurios natos 6 stygoje: didžioji tercija yra 4 skersinės aukščiau, mažoji 3. Kvinta: ta pati nata +2 skersinės 5 stygoje (galios akordo forma). Klausykite, kuo skiriasi tercijos."},
  {id:"chordnotes",n:"Akordų natos",m:3,h:"Grokite C, G, Am akordus po vieną stygą ir pasakykite, kuri nata yra 1, kuri 3, kuri 5."},
  {id:"fsmall",n:"Mažasis F",m:4,changes:[["C","F"],["Am","F"]],h:"F be pilnos barės: 1 pirštas spaudžia 1 ir 2 stygas ties 1 skersine, 2 pirštas 3 st. 2 sk., 3 pirštas 4 st. 3 sk. Grokite tik 4 plonąsias stygas."},
  {id:"pop",n:"I–V–vi–IV",m:5,bpm:80,h:"C–G–Am–F, tada G–D–Em–C. Ritmas Ž Ž A A Ž A. Pabandykite padainuoti bet kokią žinomą dainą ant šios progresijos."},
  {id:"scale",n:"C majoro gama",m:2,bpm:80,h:"Pirmoje pozicijoje, aštuntinėmis 60 bpm arba ketvirtinėmis 80 bpm."}
 ],
 goals:["Galiu pasakyti C, G, D, Am, Em akordų natas ir paaiškinti 1–3–5","Žinau visus 7 C ir G tonacijų akordus","Mažasis F skamba švariai","I–V–vi–IV groju C ir G tonacijose 80 bpm su ritmu Ž Ž A A Ž A"]},

{title:"Pentatonika, bliuzas ir paralelinės tonacijos",
 focus:"Pirmoji improvizacija ir supratimas, kaip susijusios tonacijos.",
 theory:`<h3>Minorinė pentatonika</h3><p>Penkių natų gama: <span class="k">1 ♭3 4 5 ♭7</span>. A minoro pentatonika: A C D E G.</p>${scaleRow(["A","C","D","E","G"])}
 <p>Ji „neturi blogų natų“ virš minorinių akordų, todėl puikiai tinka pradėti improvizuoti.</p>
 <h3>Paralelinės tonacijos</h3><p>Am ir C majoras turi tas pačias natas. Am yra C majoro vi laipsnis. Kiekviena majoro tonacija turi savo paralelinį minorą (G ir Em, D ir Bm).</p>
 <h3>Kvintų ratas</h3><p><span class="k">C → G → D → A → E → B</span>: kiekvienas žingsnis kvinta aukštyn prideda vieną diezą. Akordeono kairės rankos bosai išdėstyti būtent pagal šį ratą.</p>
 <h3>12 taktų bliuzas</h3><p><span class="k">I I I I | IV IV I I | V IV I V</span>. A tonacijoje: A, D, E.</p>`,
 ex:[
  {id:"warm",n:"Apšilimas",m:2,h:"Chromatinis pratimas 80 bpm."},
  {id:"penta",n:"Am pentatonika (5 sk.)",m:5,bpm:70,h:"Pirmoji „dėžutė“: kiekvienoje stygoje 5 ir 8 skersinės, išskyrus 3 ir 2 stygas (5–7 ir 5–8). Aukštyn ir žemyn aštuntinėmis. 1 pirštas visada 5 skersinėje."},
  {id:"blues",n:"12 taktų bliuzas A",m:5,bpm:80,h:"Galios akordas su „shuffle“ judesiu: A5 ↔ A6 nuo 5 stygos, D5 ↔ D6 nuo 4 stygos, E5 ↔ E6 nuo 6 stygos. Sekite schemą I I I I | IV IV I I | V IV I V."},
  {id:"impro",n:"Improvizacija",m:5,h:"Įsijunkite „A minor backing track“ (YouTube) arba įsirašykite Am–G–F. Naudokite tik 3–4 pentatonikos natas ir kartokite trumpas frazes. Mažiau natų yra geriau."},
  {id:"review",n:"Akordų ratas",m:3,h:"Visi išmokti akordai po 2 kartus, keičiant tvarką."}
 ],
 goals:["Am pentatoniką groju aštuntinėmis 80 bpm","12 taktų bliuzą A tonacijoje groju nesustodamas","Galiu paaiškinti, kodėl Am ir C turi tas pačias natas","Žinau kvintų ratą C–G–D–A–E ir kiek kiekviena tonacija turi diezų"]},

{title:"Barė akordai ir septakordai",

 <p><b>E forma</b>: šaknis 6 stygoje. 1 sk. F, 3 sk. G, 5 sk. A.<br><b>A forma</b>: šaknis 5 stygoje. 2 sk. Bm, 3 sk. Cm, 5 sk. Dm.</p>
 <h3>Septakordai</h3><p>Prie trigarsio pridedame 7-ą laipsnį:</p>
 <p><span class="k">G7 = G B D F</span> (dominantinis, „traukia“ į C)<br><span class="k">Cmaj7 = C E G B</span> (švelnus, džiazinis)<br><span class="k">Am7 = A C E G</span> (minkštas minoras)</p>`,

const EAR_MAP={"0:notes65":1};
[["hl","Klausa: aukščiau ar žemiau ir natą į gitarą",3,"Pradėkite nuo „Aukščiau ar žemiau“. Kai pasieksite 3 lygį, pereikite prie „Natą į gitarą“ su atviromis stygomis.","match"],
 ["iv","Klausa: intervalai",4,"Pradėkite nuo oktavos ir kvintos. Prieš atsakydami tyliai padainuokite abi natas."],
 ["iv","Klausa: intervalai ir akordai",4,"Intervalai aukštyn ir žemyn, tada majoras ar minoras skiltyje „Akordai“."],
 ["ch","Klausa: akordai",4,"Majoras, minoras ir 7. Klausykite akordo „nuotaikos“."],
 ["ch","Klausa: septakordai",4,"Maj7, m7 ir 7: aukštesni akordų lygiai."],
 ["pr","Klausa: progresijos",5,"Atpažinkite I–IV–V ir I–V–vi–IV. Tai raktas į dainų mokymąsi iš klausos."]].forEach((x,i)=>{PHASES[i].ex.push({id:"eartr",n:x[1],m:x[2],h:x[3],eartr:x[0],eartr2:x[4]});});
/* ---------- state ---------- */
const KEY="gitara-pratybos-v1";
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysBetween(a,b){const pa=a.split("-").map(Number),pb=b.split("-").map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5);}
function fresh(){return {phase:0,phaseStart:todayStr(),goals:{},log:{},done:{},updatedAt:0};}
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}

let dbRef=null,saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbRef){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{});},800);}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    dbRef=db.doc("data/users/"+uid+"/progress");
    const snap=await dbRef.get();
    if(snap.exists){const d=snap.data()||{};if((d.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(fresh(),d);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();}else if((S.updatedAt||0)>(d.updatedAt||0)){dbRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{});}}
    else if(S.updatedAt){dbRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{});}
  }catch(e){}
})();

function doneToday(){const t=todayStr();return (S.done[t]||[]);}
function secsToday(){return S.log[todayStr()]||0;}
function addSecs(s){if(s<=0)return;const t=todayStr();S.log[t]=(S.log[t]||0)+Math.round(s);}
function markDone(id,on){const t=todayStr();const a=new Set(S.done[t]||[]);on?a.add(id):a.delete(id);S.done[t]=[...a];}
function streak(){let n=0;const d=new Date();if(!S.log[todayStr(d)])d.setDate(d.getDate()-1);while(S.log[todayStr(d)]>=60){n++;d.setDate(d.getDate()-1);}return n;}
function phaseGoals(){return S.goals[S.phase]||[];}

/* ---------- audio ---------- */
let AC=null;
let unlocked=false;
function silentWav(){const n=800,b=new Uint8Array(44+n*2),v=new DataView(b.buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);let s="";b.forEach(x=>s+=String.fromCharCode(x));return "data:audio/wav;base64,"+btoa(s);}
function unlock(){if(unlocked)return;unlocked=true;try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}try{const a=new Audio(silentWav());a.loop=true;a.setAttribute("playsinline","");a.volume=0.01;a.play().catch(()=>{});}catch(e){}}
function ac(){unlock();if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==="suspended")AC.resume();if(AC&&!ac.primed){ac.primed=true;try{const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0.0001;o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+0.02);}catch(e){}}return AC;}
function click(time,accent){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=accent?1760:1175;g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(accent?0.6:0.4,time+0.002);g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);o.connect(g).connect(a.destination);o.start(time);o.stop(time+0.06);}
function chime(){const a=ac();if(!a)return;const t=a.currentTime;[659.25,783.99,987.77].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*0.18);g.gain.exponentialRampToValueAtTime(0.4,t+i*0.18+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.18+0.6);o.connect(g).connect(a.destination);o.start(t+i*0.18);o.stop(t+i*0.18+0.65);});}

let wake=null;
async function wakeOn(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}}catch(e){}}
function wakeOff(){if(!T.running&&!M.running&&!(typeof P!=="undefined"&&P.on)&&wake){wake.release().catch(()=>{});wake=null;}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(T.running||M.running))wakeOn();});

/* ---------- timer ---------- */
const T={id:null,total:0,left:0,running:false,last:0,iv:null,spent:0};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function timerFor(ex){if(T.id!==ex.id){if(T.running)pauseT();T.id=ex.id;T.total=ex.m*60;T.left=T.total;T.spent=0;}}
function startT(ex){ac();if(ex.changes&&!CH2.active&&!RM.active){rmCfg().mode==="rhythm"?startRhythm(ex):startChanges(ex);}if(ex.drill&&!(P.round&&P.round.inline))startInline();timerFor(ex);if(T.left<=0)T.left=T.total;if(ex.bpm&&S.metroWithTimer!==false&&!ex.changes){setBpm(ex.bpm);if(!M.running){startM();M.byTimer=true;}}T.running=true;T.last=performance.now();clearInterval(T.iv);T.iv=setInterval(tick,250);wakeOn();paintTimer();}
function stopTimerMetro(){if(M.byTimer){M.byTimer=false;stopM();}}
function pauseT(){if(!T.running)return;tick();T.running=false;clearInterval(T.iv);stopTimerMetro();if(P.round&&P.round.inline)endRound();if(CH2.active)endChanges();if(RM.active)endRhythm();flushSpent();wakeOff();paintTimer();}
function resetT(ex){pauseT();T.id=ex.id;T.total=ex.m*60;T.left=T.total;T.spent=0;paintTimer();}
function flushSpent(){if(T.spent>0){addSecs(T.spent);T.spent=0;save();paintStats();}}
function tick(){if(!T.running)return;const now=performance.now();const dt=(now-T.last)/1000;T.last=now;T.left-=dt;T.spent+=dt;
  if(T.left<=0){T.left=0;T.running=false;clearInterval(T.iv);stopTimerMetro();if(P.round&&P.round.inline)endRound();if(CH2.active)endChanges();if(RM.active)endRhythm();flushSpent();markDone(T.id,true);save();chime();toast("Laikas baigėsi. Pratimas atliktas!");wakeOff();renderToday();return;}
  paintTimer();}
function paintTimer(){document.querySelectorAll("[data-clock]").forEach(el=>{const id=el.dataset.clock;const ex=curEx().find(e=>e.id===id);if(!ex)return;const tot=ex.m*60;const left=T.id===id?T.left:tot;el.textContent=fmt(left);el.classList.toggle("run",T.id===id&&T.running);const bar=document.querySelector('[data-bar="'+id+'"]');if(bar)bar.style.width=((1-left/tot)*100)+"%";const b=document.querySelector('[data-start="'+id+'"]');if(b)b.textContent=(T.id===id&&T.running)?"Pauzė":(T.id===id&&left<tot&&left>0?"Tęsti":"Pradėti");});}

function curEx(){return PHASES[S.phase].ex;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},2600);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- views ---------- */
function stageHeader(){
  const p=PHASES[S.phase];const day=practiceDay();
  return `<div class="head"><span class="eyebrow">${S.phase+1} etapas iš ${PHASES.length} · ${day}-a pratybų diena iš ~14</span><h1>${esc(p.title)}</h1><p class="muted">${esc(p.focus)}</p></div>`;
}
function practicedDays(){return Object.keys(S.done||{}).filter(d=>d>=S.phaseStart&&(S.done[d]||[]).some(id=>id!=="eartr")).sort();}
function practiceDay(){const t=todayStr();const p=practicedDays();return p.filter(d=>d<t).length+1;}
function fretStrip(){

/* ---------- grifo natų treniruoklis su mikrofonu ---------- */
const STR_MIDI={6:40,5:45,4:50,3:55,2:59,1:64};
const NATURAL=["C","D","E","F","G","A","B"];
const P={on:false,stream:null,src:null,an:null,buf:null,raf:0,round:null,hist:[],okSince:0,badSince:0,last:null,tickIv:null};
function trCfg(){if(!S.tr)S.tr={strings:[6,5],notes:"natural",maxFret:12,len:20};return S.tr;}
function trCells(){if(!S.trCells)S.trCells={};return S.trCells;}
function trHist(){if(!S.trHist)S.trHist=[];return S.trHist;}
function noteFromFreq(f){const x=12*Math.log2(f/440)+69;const r=Math.round(x);return {midi:r,pc:((r%12)+12)%12,name:NOTES[((r%12)+12)%12],oct:Math.floor(r/12)-1,cents:Math.round((x-r)*100)};}
function detectPitch(buf,sr){
  const N=buf.length;let rms=0;for(let i=0;i<N;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/N);if(rms<0.012)return -1;
  const minLag=Math.floor(sr/1100),maxLag=Math.min(N>>1,Math.floor(sr/65));
  const n=new Float32Array(maxLag+2);
  for(let lag=0;lag<=maxLag+1;lag++){let r=0,m=0;for(let j=0;j<N-lag;j++){const a=buf[j],b=buf[j+lag];r+=a*b;m+=a*a+b*b;}n[lag]=m>0?2*r/m:0;}
  let d=minLag;while(d<maxLag&&n[d]>0)d++;
  let best=-1;for(let i=d;i<=maxLag;i++)if(n[i]>best)best=n[i];
  if(best<0.6)return -1;
  let pos=-1;for(let i=Math.max(d,1);i<=maxLag;i++){if(n[i]>n[i-1]&&n[i]>=n[i+1]&&n[i]>=0.9*best){pos=i;break;}}
  if(pos<1)return -1;
  const x1=n[pos-1],x2=n[pos],x3=n[pos+1];const a=(x1+x3-2*x2)/2,b=(x3-x1)/2;const T0=a?pos-b/(2*a):pos;
  const f=sr/T0;return (f>60&&f<1200)?f:-1;
}
function cellPool(){const c=trCfg();const out=[];c.strings.forEach(s=>{for(let fr=0;fr<=c.maxFret;fr++){const m=STR_MIDI[s]+fr;const n=NOTES[m%12];if(c.notes==="natural"&&!NATURAL.includes(n))continue;out.push({s,fr,m,n});}});return out;}
function poolNotes(){return [...new Set(cellPool().map(x=>x.n))].sort((a,b)=>NOTES.indexOf(a)-NOTES.indexOf(b));}
function pickCell(prev){
  const pool=(P.round&&P.round.fixPool&&P.round.fixPool.length)?P.round.fixPool:cellPool();if(!pool.length)return null;const st=trCells();
  // dažniau rodome lėtas ir klaidingas vietas
  const w=pool.map(x=>{const k=x.s+":"+x.fr;const r=st[k];let v=r?1+Math.min(4,(r.sum/r.n)/2)+r.err*1.5/Math.max(1,r.n):2.5;if(prev&&prev.n===x.n&&prev.s===x.s)v=0;return v;});
  const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}return pool[pool.length-1];
}
function accepts(cell,midi){
  // ta pati nata toje pačioje stygoje (0 ir 12 sk. abu tinka); žemoms stygoms toleruojame oktavos klaidą
  const c=trCfg();const ok=[];for(let fr=0;fr<=c.maxFret;fr++){const m=STR_MIDI[cell.s]+fr;if(m%12===cell.m%12)ok.push(m);}
  if(ok.includes(midi))return true;
  if(cell.m<52&&ok.some(m=>m+12===midi))return true;
  return false;
}
function beep(ok){const a=ac();if(!a)return;const t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=ok?1318.5:220;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.22);}

async function micOn(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Ši naršyklė neleidžia naudoti mikrofono.");return false;}
  try{if(navigator.audioSession)navigator.audioSession.type="play-and-record";}catch(e){}
  const a=ac();
  try{P.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
  catch(e){toast("Mikrofonas neleistas. Leiskite jį naršyklės nustatymuose.");return false;}
  P.src=a.createMediaStreamSource(P.stream);P.an=a.createAnalyser();P.an.fftSize=2048;P.src.connect(P.an);P.buf=new Float32Array(P.an.fftSize);
  P.on=true;P.hist=[];wakeOn();loop();return true;
}
function micOff(){P.on=false;cancelAnimationFrame(P.raf);clearInterval(P.tickIv);try{P.stream&&P.stream.getTracks().forEach(t=>t.stop());}catch(e){}try{P.src&&P.src.disconnect();}catch(e){}P.stream=null;try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}wakeOff();}

async function startRound(fix){
  if(!cellPool().length){toast("Pasirinkite bent vieną stygą.");return;}
  if(!P.on&&!(await micOn()))return;
  P.round={items:[],cur:null,len:trCfg().len,started:Date.now(),fixPool:fix?weakCells():null};nextItem();renderEar();
  clearInterval(P.tickIv);P.tickIv=setInterval(paintClock,100);
}
function nextItem(){const R=P.round;const prev=R.cur?R.cur.cell:null;R.cur={cell:pickCell(prev),t0:performance.now(),wrong:false,hint:false};P.okSince=0;P.badSince=0;P.hist=[];paintRound();}
function finishItem(ok,skipped){
  const R=P.round;const it=R.cur;const t=(performance.now()-it.t0)/1000;
  const rec={n:it.cell.n,s:it.cell.s,fr:it.cell.fr,t:+t.toFixed(2),first:ok&&!it.wrong,skip:!!skipped};R.items.push(rec);
  const k=it.cell.s+":"+it.cell.fr;const st=trCells();const r=st[k]||{n:0,sum:0,err:0};
  if(!skipped){r.n++;r.sum+=Math.min(t,15);}if(it.wrong||skipped)r.err++;st[k]=r;
  if(ok)beep(true);
  const el=document.getElementById("trNote");if(el&&ok){el.classList.add("ok");}
  if(R.items.length>=R.len){setTimeout(endRound,350);}else setTimeout(()=>{if(P.round===R)nextItem();},ok?450:0);
  R.cur=Object.assign({},it,{done:true});
}
function endRound(){
  const R=P.round;if(!R)return;clearInterval(P.tickIv);
  if(R.inline&&!R.items.length){P.round=null;micOff();const db0=document.getElementById("drillBox");if(db0)db0.innerHTML=drillHtml();return;}
  const done=R.items.filter(x=>!x.skip);const avg=done.length?done.reduce((a,b)=>a+b.t,0)/done.length:0;
  const first=R.items.filter(x=>x.first).length;
  const res={d:todayStr(),n:R.items.length,first,avg:+avg.toFixed(2),strings:(R.focus||trCfg().strings).slice(),notes:R.focus?"natural":trCfg().notes};
  trHist().push(res);if(S.trHist.length>200)S.trHist.shift();
  if(!R.inline)addSecs((Date.now()-R.started)/1000);
  P.lastRes={res,items:R.items,inline:!!R.inline};P.round=null;save();micOff();if(!R.inline)chime();renderEar();const db=document.getElementById("drillBox");if(db)db.innerHTML=drillHtml();paintStats&&paintStats();
}
function stopRound(){if(P.round&&P.round.items.length>0){endRound();}else{P.round=null;clearInterval(P.tickIv);micOff();renderEar();}}

let frameFlip=false;
function loop(){
  if(!P.on)return;P.raf=requestAnimationFrame(loop);if(CAL.active){calFrame();return;}if(RM.active){if(P.anLow)rhythmFrame();return;}if(CH2.active){chordFrame();return;}frameFlip=!frameFlip;if(frameFlip)return;
  P.an.getFloatTimeDomainData(P.buf);const f=detectPitch(P.buf,AC.sampleRate);
  P.hist.push(f<0?null:noteFromFreq(f));if(P.hist.length>5)P.hist.shift();

  for(let i=0;i<len;i++){const cur=ring[idx];const nxt=ring[(idx+1)%N];const v=decay*0.5*(cur+nxt);ring[idx]=v;d[i]=cur;idx=(idx+1)%N;}

function optLabel(m,k){if(m==="iv")return `<b>${k}</b><small>${IV[k][1]}</small>`;if(m==="ch")return `<b>${CH[k][1]}</b><small>${CH[k][2]}</small>`;return `<b>${k}</b>`;}

const GRADE_W={10:"puikiai",9:"labai gerai",8:"gerai",7:"vidutiniškai",6:"patenkinamai",5:"pakankamai"};

/* sesija */
function startSess(fix){
  const s=eSt();E.sess={fix:!!fix,fixOpts:fix?fixSet(E.mode):null,fixPool:fix&&E.mode==="match"?Array.from({length:21},(_,i)=>40+i).filter(m=>weakItems("match").some(w=>w.k===NOTES[m%12])):null,mode:E.mode,level:eLevel(E.mode),n:s.len,i:0,ok:0,times:[],replays:0,conf:{},t0:Date.now()};E.last=null;E.q=null;
  if(E.mode==="match"&&!P.on){micOn().then(ok=>{if(!ok){E.sess=null;renderEarTrain();return;}nextQ(true);});return;}
  nextQ(true);
}
function nextQ(play){
  const ss=E.sess;if(ss&&ss.i>=ss.n){endSess();return;}
  E.q=makeQ();E.answered=false;E.okSince=0;renderEarTrain();
  if(play){const d=playQ();E.ignoreUntil=performance.now()+d*1000+250;E.readyAt=performance.now()+d*1000;E.mmT0=E.readyAt;}
}
function answer(k){
  const q=E.q,ss=E.sess;if(!q)return;
  if(E.answered||!ss){playQ(q,k);return;}
  E.answered=true;const ok=k===q.ans;const t=Math.max(0,(performance.now()-E.readyAt)/1000);
  ss.i++;ss.times.push(t);if(ok)ss.ok++;else{const key=ansName(q.kind,q.ans)+" → "+ansName(q.kind,k);ss.conf[key]=(ss.conf[key]||0)+1;}
  record(q.kind,q.ans,ok);if(!ok){const cf=eConf(q.kind);cf[q.ans+"|"+k]=(cf[q.ans+"|"+k]||0)+1;}beep(ok);
  const fb=document.getElementById("eFb");
  let extra="";if(q.kind==="iv")extra=` Įsiminkite: ${IV[q.ans][2]}.`;if(q.kind==="ch")extra=` Skamba ${CH[q.ans][2]}.`;
  if(fb){fb.className="efb "+(ok?"good":"bad");fb.innerHTML=(ok?"Teisingai! ":"Ne visai. Teisingas atsakymas: <b>"+ansName(q.kind,q.ans)+"</b>.")+extra+(!ok&&q.kind!=="hl"?"<br><span class='muted'>Paspauskite variantus ir palyginkite, kaip jie skamba.</span>":"");}
  document.querySelectorAll("[data-eans]").forEach(b=>{const v=b.dataset.eans;b.classList.toggle("right",v===q.ans);b.classList.toggle("wrongb",v===k&&!ok);});
  const nx=document.getElementById("eNext");if(nx){nx.hidden=false;nx.textContent=ss.i>=ss.n?"Baigti sesiją":"Kitas klausimas";}
  paintProg();
  if(ok)setTimeout(()=>{if(E.q===q&&E.sess===ss)nextQ(true);},1000);
}
function paintProg(){const p=document.getElementById("eProg");const ss=E.sess;if(p&&ss)p.textContent=`${Math.min(ss.i+(E.answered?0:1),ss.n)} / ${ss.n} · teisingai ${ss.ok}`;}
function earStable(st){
  const q=E.q,ss=E.sess;if(!q||q.kind!=="match"||E.answered||!ss)return;const now=performance.now();
  const heard=document.getElementById("eHeard");
  if(now<E.ignoreUntil){if(heard)heard.textContent="Klausykite…";return;}
  if(heard){heard.textContent=st?"Girdžiu: "+st.name+st.oct:"Klausau…";heard.className="heard"+(st?(st.midi===q.note?" good":" bad"):"");}
  if(!st){E.okSince=0;return;}
  if(st.midi===q.note||(q.note<52&&st.midi===q.note+12)){if(!E.okSince)E.okSince=now;else if(now-E.okSince>200){E.answered=true;const t=(now-E.mmT0)/1000;ss.i++;ss.ok++;ss.times.push(t);record("match",NOTES[q.note%12],true);beep(true);const fb=document.getElementById("eFb");if(fb){fb.className="efb good";fb.innerHTML=`Teisingai: <b>${q.ans}</b> per ${t.toFixed(1)} s.`;}paintProg();setTimeout(()=>{if(E.q===q&&E.sess===ss)nextQ(true);},1100);}}
  else E.okSince=0;
}
function gradeSess(ss){
  const mode=ss.mode;const acc=ss.ok/ss.n;
  const nOpts=mode==="match"?0:mode==="hl"?2:(ss.fixOpts||EMODES[mode].levels[ss.level]).length;const chance=nOpts?1/nOpts:0;
  const norm=Math.max(0,(acc-chance)/(1-chance));const medT=median(ss.times);
  const fast=mode==="match"?5:mode==="pr"?4:2.5,slow=mode==="match"?10:mode==="pr"?8:6;
  let g=norm*10;const notes=[];
  notes.push(`Tikslumas ${Math.round(acc*100)}%`+(chance?` (spėjant atsitiktinai būtų ~${Math.round(chance*100)}%, todėl jis perskaičiuojamas)`:"")+` → ${(norm*10).toFixed(1)} balo.`);
  if(medT>slow){g-=1;notes.push(`Atsakymai lėti (vid. ${medT.toFixed(1)} s, daugiau nei ${slow} s): −1.`);}
  else if(medT<=fast&&acc>=0.9){g+=0.5;notes.push(`Greiti ir tikslūs atsakymai (vid. ${medT.toFixed(1)} s): +0,5.`);}
  if(ss.replays/ss.n>0.5){g-=0.5;notes.push(`Dažnai klausėte pakartotinai (${ss.replays} k.): −0,5.`);}
  g=Math.max(1,Math.min(10,Math.round(g)));return {g,acc,medT,notes};
}
function endSess(){
  const ss=E.sess;if(!ss)return;E.sess=null;if(P.on)micOff();
  const n=ss.i;if(!n){E.q=null;renderEarTrain();return;}ss.n=n;
  const gr=gradeSess(ss);const dur=Math.round((Date.now()-ss.t0)/1000);
  const r={d:todayStr(),mode:ss.mode,level:ss.level,n,ok:ss.ok,grade:gr.g,medT:+gr.medT.toFixed(1),dur,replays:ss.replays,conf:Object.entries(ss.conf).sort((a,b)=>b[1]-a[1]).slice(0,3),notes:gr.notes,up:false,fix:ss.fix};
  const max=EMODES[ss.mode].levels.length-1;
  if(!ss.fix&&gr.g>=9&&n>=10&&ss.level===eLevel(ss.mode)&&ss.level<max){eSt().level[ss.mode]=ss.level+1;r.up=true;}
  if(!S.earHist)S.earHist=[];S.earHist.push(r);if(S.earHist.length>300)S.earHist.shift();
  if(E.fromToday)markDone(E.fromToday,true);
  addSecs(dur);save();paintStats&&paintStats();E.last=r;E.q=null;chime();renderEarTrain();
}
function fmtDur(s){return s>=60?Math.floor(s/60)+" min "+(s%60)+" s":s+" s";}
function resultHtml(r){

   ${E.fromToday?'<button class="btn primary" data-gotab="today">Grįžti į šiandienos pratimus</button><button class="btn" id="eStart">Dar viena sesija</button>':'<button class="btn primary" id="eStart">Nauja sesija</button>'}</div>`;

function histEar(m){
  const H=(S.earHist||[]).filter(x=>x.mode===m).slice(-6).reverse();if(!H.length)return '';

}
function renderEarTrain(){

  }else{

     <div class="efb" id="eFb"></div><div class="row"><button class="btn small" id="eNext" hidden>Kitas klausimas</button><button class="btn small" id="eStop">Baigti sesiją</button></div></div>`;

function earTrainClick(t){
  if(t.dataset.emode)E.fromToday=null;
  if(t.dataset.emode){if(E.sess)return true;E.mode=t.dataset.emode;E.q=null;renderEarTrain();return true;}
  if(t.dataset.elevel){eSt().level[E.mode]=+t.dataset.elevel;save();E.last=null;renderEarTrain();return true;}
  if(t.dataset.istyle){E.ivStyle=t.dataset.istyle;renderEarTrain();return true;}
  if(t.dataset.elen){eSt().len=+t.dataset.elen;save();renderEarTrain();return true;}
  if(t.id==="eStart"){startSess(false);return true;}
  if(t.id==="eFix"){startSess(true);return true;}
  if(t.dataset.eans){answer(t.dataset.eans);return true;}
  if(t.id==="ePlay"){const d=playQ();if(E.sess&&!E.answered)E.sess.replays++;E.ignoreUntil=performance.now()+d*1000+250;return true;}
  if(t.id==="eNext"){nextQ(true);return true;}
  if(t.id==="eSkip"){const ss=E.sess;if(ss&&E.q&&!E.answered){ss.i++;ss.times.push(Math.max(0,(performance.now()-E.mmT0)/1000));record("match",NOTES[E.q.note%12],false);const key="Nerasta "+E.q.ans;ss.conf[key]=(ss.conf[key]||0)+1;}nextQ(true);return true;}

  return false;
}

/* ---------- akordų keitimai su kokybės vertinimu ---------- */
const CHORD_PCS={Em:[4,7,11],Am:[9,0,4],C:[0,4,7],G:[7,11,2],D:[2,6,9],F:[5,9,0],Bm:[11,2,6]};
const STRICT={lenient:[0.42,0.12,0.32],normal:[0.5,0.18,0.4],strict:[0.6,0.25,0.48]};
const STRICT_T={lenient:"Atlaidus",normal:"Vidutinis",strict:"Griežtas"};
const CH2={active:false,ex:null,pair:null,expect:1,cur:0,changes:0,clean:0,strums:[],t0:0,floor:[],lastOn:0,pendingAt:0,manual:false,last:null,missing:{}};
function chgCfg(){if(!S.chg)S.chg={pair:{},strict:"normal"};return S.chg;}
function chgPair(ex){const c=chgCfg();const i=c.pair[ex.id]||0;return ex.changes[Math.min(i,ex.changes.length-1)];}
function chroma(){
  const a=AC,an=P.an2;if(!an)return null;an.getFloatFrequencyData(P.fbuf);const sr=a.sampleRate,bins=P.fbuf.length,hz=sr/an.fftSize;
  const c=new Float32Array(12);
  for(let i=Math.floor(75/hz);i<Math.min(bins,Math.ceil(1050/hz));i++){const db=P.fbuf[i];if(!isFinite(db))continue;const p=Math.pow(10,db/10);const m=69+12*Math.log2(i*hz/440);const r=Math.round(m);if(Math.abs(m-r)>0.4)continue;c[((r%12)+12)%12]+=p;}
  let s=0;for(let i=0;i<12;i++)s+=c[i];if(s<=0)return null;for(let i=0;i<12;i++)c[i]/=s;return c;
}
const CALTH={lenient:[0.75,0.25,0.62],normal:[0.83,0.33,0.7],strict:[0.9,0.45,0.8]};
function calChord(n){return S.cal&&S.cal.chords&&S.cal.chords[n];}
function judge(ch,name){const c=calChord(name);const g=judgeGeneric(ch,name);if(!c)return {pur:g.pur,miss:g.miss,th:STRICT[chgCfg().strict]};
  const thr=CALTH[chgCfg().strict];const sim=cosSim(ch,c.t);const t=CHORD_PCS[name];const miss=t.filter(p=>c.t[p]>0.03&&ch[p]/c.t[p]<thr[1]).map(p=>NOTES[p]);return {pur:sim,miss,th:thr};}
function classify(ch,a,b){const ca=calChord(a),cb=calChord(b);if(ca&&cb)return cosSim(ch,ca.t)>=cosSim(ch,cb.t)?0:1;return judgeGeneric(ch,a).pur>=judgeGeneric(ch,b).pur?0:1;}
function judgeGeneric(ch,name){const t=CHORD_PCS[name];const h=[...new Set(t.map(p=>(p+7)%12))].filter(p=>!t.includes(p));const pur=Math.min(1,t.reduce((a,p)=>a+ch[p],0)+0.7*h.reduce((a,p)=>a+ch[p],0));const mx=Math.max(...t.map(p=>ch[p]));const miss=t.filter(p=>ch[p]/mx<STRICT[chgCfg().strict][1]).map(p=>NOTES[p]);return {pur,miss};}
function chordFrame(){
  P.an.getFloatTimeDomainData(P.buf);let rms=0;for(let i=0;i<P.buf.length;i++)rms+=P.buf[i]*P.buf[i];rms=Math.sqrt(rms/P.buf.length);
  const now=performance.now();const fl=CH2.floor;fl.push(rms);if(fl.length>8)fl.shift();const floor=Math.min(...fl);
  if(!CH2.pendingAt&&now-CH2.lastOn>280&&rms>Math.max(0.015,((S.cal&&S.cal.noise)||0)*3)&&rms>floor*2.2){CH2.lastOn=now;CH2.pendingAt=now+300;}
  if(CH2.pendingAt&&now>=CH2.pendingAt){CH2.pendingAt=0;const ch=chroma();if(ch)onStrum(ch);}
}
function onStrum(ch){
  const p=CH2.pair;const ja=judge(ch,p[0]),jb=judge(ch,p[1]);const idx=classify(ch,p[0],p[1]);const j=idx?jb:ja;
  if(idx!==CH2.expect){paintChg();return;}
  const th=j.th;const q=(j.pur>=th[0]&&!j.miss.length)?"clean":(j.pur>=th[2]?"mid":"bad");
  registerChange(q,j.miss,Math.round(j.pur*100));
}
function registerChange(q,miss,pur){
  noteMiss(CH2.pair[CH2.expect],miss);
  CH2.changes++;if(q==="clean")CH2.clean++;CH2.strums.push(q);CH2.cur=CH2.expect;CH2.expect=1-CH2.expect;
  (miss||[]).forEach(n=>CH2.missing[n]=(CH2.missing[n]||0)+1);CH2.last={q,miss:miss||[],pur};
  if(q!=="clean")beep(false);paintChg();
}
async function startChanges(ex){
  if(CH2.active)return;Object.assign(CH2,{active:true,ex,pair:chgPair(ex),expect:1,cur:0,changes:0,clean:0,strums:[],t0:performance.now(),floor:[],lastOn:0,pendingAt:0,last:null,missing:{},result:null});

  CH2.manual=!ok;if(ok){P.an2=AC.createAnalyser();P.an2.fftSize=8192;P.an2.smoothingTimeConstant=0;P.src.connect(P.an2);P.fbuf=new Float32Array(P.an2.frequencyBinCount);}
  CH2.t0=performance.now();paintChg();
}

  const min=Math.max((performance.now()-CH2.t0)/60000,1/60);
  if(CH2.changes>0){const r={d:todayStr(),pair:CH2.pair.join("–"),changes:CH2.changes,clean:CH2.clean,perMin:Math.round(CH2.changes/min),cleanPerMin:Math.round(CH2.clean/min),miss:Object.entries(CH2.missing).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])};
    if(!S.chHist)S.chHist=[];S.chHist.push(r);if(S.chHist.length>200)S.chHist.shift();CH2.result=r;save();}

}

function calClick(t){
  if(t.id==="calNoise"){calStart("noise",null);return true;}
  if(t.dataset.cals){CAL.msg2="";calStart("string",+t.dataset.cals);return true;}
  if(t.dataset.calc){CAL.msg2="";calStart("chord",t.dataset.calc);return true;}
  if(t.id==="calForce"){if(CAL.lastRaw&&CAL.active){CAL.got.push(CAL.lastRaw);CAL.lastRaw=null;CAL.rejects=0;CAL.msg=`Įskaityta ${CAL.got.length} iš 3.`;if(CAL.got.length>=3){const G=CAL.got;const t2=new Array(12).fill(0);G.forEach(x=>x.ch.forEach((v,i)=>t2[i]+=v/3));const avg=k=>G.reduce((a,x)=>a+x[k],0)/3;calData().chords[CAL.target]={t:t2,peak:avg("peak"),br:avg("br"),rise:avg("rise"),d:todayStr()};save();const nm=CAL.target;calStop();CAL.msg=`${nm} įrašytas kaip jūsų etalonas.`;}renderCal();}return true;}
  if(t.id==="calCancel"){calStop();CAL.msg="";renderCal();return true;}
  if(t.id==="calOpen"){CAL.msg="";renderCal();show("cal");return true;}
  if(t.id==="calBack"){if(CAL.active)calStop();show("today");return true;}
  return false;
}

function eConf(m){const s=eSt();if(!s.conf)s.conf={};if(!s.conf[m])s.conf[m]={};return s.conf[m];}
function weakItems(m){
  const it=(eSt().items||{})[m]||{};
  return Object.entries(it).filter(([k,r])=>r.n>=2&&r.ok/r.n<0.85).map(([k,r])=>({k,n:r.n,ok:r.ok,score:(r.n-r.ok+1)/(r.n+2)})).sort((a,b)=>b.score-a.score);
}
function topConf(m){return Object.entries(eConf(m)).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({a:k.split("|")[0],b:k.split("|")[1],v}));}
function fixSet(m){
  if(m==="hl"||m==="match")return null;
  const set=new Set();weakItems(m).slice(0,2).forEach(w=>set.add(w.k));
  topConf(m).slice(0,2).forEach(c=>{set.add(c.a);set.add(c.b);});
  const all=m==="iv"?Object.keys(IV):m==="ch"?Object.keys(CH):Object.keys(PR);
  const arr=[...set].filter(k=>all.includes(k)).slice(0,4);
  if(arr.length<2)return null;return arr;
}
function fixAvailable(m){if(m==="hl")return false;if(m==="match")return weakItems("match").length>0;return !!fixSet(m);}

}

     ${bad.length?`<ul class="tips">${bad.map(r=>`<li>${esc(scTip(r))}</li>`).join('')}</ul><span class="muted" style="font-size:.88rem">Pataisykite pirštus ir patikrinkite dar kartą. Kai visos stygos skamba, grįžkite prie keitimų.</span>`:'<b class="heard good">Visos stygos skamba švariai!</b>'}
     <div class="row"><button class="btn small primary" data-scgo="${SC.chord}">Tikrinti dar kartą</button><button class="btn small" id="scClose">Baigti</button></div>`;}
  let warn='';if(SC.msg==="mute")warn=`<span class="heard bad">Negirdžiu aiškaus tono. Ar styga neprislopinta?</span>`;else if(SC.msg.startsWith("wrong:"))warn=`<span class="heard bad">Girdžiu ${SC.msg.slice(6)}, o turėtų būti ${NOTES[cur.m%12]}. Patikrinkite pirštą ant ${cur.s} stygos.</span>`;
  return `<span class="eyebrow">Akordo patikra · ${SC.chord} · ${SC.i+1} iš ${SC.list.length}</span>
   <p class="muted" style="font-size:.9rem">Suspauskite ${SC.chord} ir nejudinkite pirštų. Užgaukite stygas po vieną.</p>
   <div class="target">${cur.s} styga</div><div class="strlabel">turi skambėti ${NOTES[cur.m%12]}${cur.fr?` (${cur.fr} sk.)`:" (atvira)"}</div>
   <span class="heard" id="scHeard">Klausau…</span>${warn}
   <div class="row"><button class="btn small" id="scFail">Neskamba, pažymėti</button><button class="btn small" id="scClose">Nutraukti</button></div>`;
}
function scClick(t){
  if(t.dataset.scgo){const ex=curEx().find(e=>e.id===t.dataset.scx)||SC.ex;startSC(ex,t.dataset.scgo);return true;}
  if(t.id==="scFail"){if(SC.active&&!SC.done){SC.res.push({...SC.list[SC.i],ok:false});beep(false);scNext();}return true;}
  if(t.id==="scClose"){SC.active=false;SC.done=false;micOff();paintChg();return true;}
  return false;
}
function scButtons(ex){const pair=chgPair(ex);return `<span class="eyebrow">Akordo patikra po stygą</span><div class="row">${pair.map(c=>{const w=worstMiss(c);return `<button class="btn small" data-scgo="${c}" data-scx="${ex.id}">${c}${w?` · dažnai neskamba ${w.n}`:''}</button>`;}).join('')}</div>`;}

function earTodayHtml(ex){
  const today=todayStr();const modes=[ex.eartr].concat(ex.eartr2?[ex.eartr2]:[]);
  return `<div class="drill">${modes.map(m=>{const H=(S.earHist||[]).filter(x=>x.mode===m&&x.d===today);
    return `<div class="stack" style="gap:6px;width:100%;align-items:center"><span class="eyebrow">${EMODES[m].t} · ${eLevel(m)+1} lygis</span>
     ${H.length?`<span class="muted" style="font-size:.9rem">Šiandien: ${H.map(x=>`<b>${x.grade}</b>/10`).join(", ")}</span>`:''}
     <button class="btn ${m===ex.eartr?'primary':''}" data-earsess="${m}" data-exid="${ex.id}">${H.length?'Dar viena sesija':'Pradėti sesiją'} (${eSt().len} klausimų)</button></div>`;}).join('')}
   <span class="muted" style="font-size:.85rem">Sesija atsidarys „Klausa“ skiltyje. Ją baigus, pratimas bus pažymėtas atliktu.</span></div>`;
}

/* ---------- grifo žaidimas ekrane ---------- */
const FG={active:false,target:null,t0:0,score:0,streak:0,i:0,first:0,wrong:0,times:[],res:null,lock:false,flash:{},reveal:false,tIv:null};
function fgCfg(){if(!S.fg)S.fg={strings:[6,5],notes:"natural",maxFret:12,n:20,labels:false};return S.fg;}
function fgPoolNotes(){const c=fgCfg();const set=new Set();c.strings.forEach(s=>{for(let fr=0;fr<=c.maxFret;fr++){const n=NOTES[(STR_MIDI[s]+fr)%12];if(c.notes==="all"||NATURAL.includes(n))set.add(n);}});return [...set];}
function fgKey(){const c=fgCfg();return c.strings.slice().sort().join("")+"|"+c.notes+"|"+c.maxFret;}
function fgBest(){const H=(S.fgHist||[]).filter(x=>x.key===fgKey());return H.length?Math.max(...H.map(x=>x.score)):0;}
function fgStart(){const pool=fgPoolNotes();if(!pool.length){toast("Pasirinkite bent vieną stygą.");return;}ac();Object.assign(FG,{active:true,score:0,streak:0,i:0,first:0,wrong:0,times:[],res:null,flash:{},target:null,started:Date.now()});fgNext();clearInterval(FG.tIv);FG.tIv=setInterval(fgClock,100);}
function fgNext(){const c=fgCfg();const cells=[];c.strings.forEach(s=>{const seen=new Set();for(let fr=0;fr<=c.maxFret;fr++){const n=NOTES[(STR_MIDI[s]+fr)%12];if((c.notes==="all"||NATURAL.includes(n))&&!seen.has(n)){seen.add(n);cells.push({s,n});}}});let x;do{x=rnd(cells);}while(cells.length>1&&x.n===FG.target&&x.s===FG.tStr);FG.target=x.n;FG.tStr=x.s;FG.t0=performance.now();FG.wrongThis=0;FG.reveal=false;FG.lock=false;FG.flash={};renderEar();}
function fgPositions(n){const c=fgCfg();const out=[];[FG.tStr].forEach(s=>{for(let fr=0;fr<=c.maxFret;fr++)if(NOTES[(STR_MIDI[s]+fr)%12]===n)out.push(s+":"+fr);});return out;}
function fgTap(s,fr){
  if(!FG.active||FG.lock)return;const c=fgCfg();if(s!==FG.tStr||fr>c.maxFret)return;
  const n=NOTES[(STR_MIDI[s]+fr)%12];const k=s+":"+fr;
  if(n===FG.target&&s===FG.tStr){const t=(performance.now()-FG.t0)/1000;const mult=1+Math.min(FG.streak,10)*0.1;const pts=Math.round((100+Math.max(0,100-t*20))*mult);
    FG.score+=pts;FG.streak++;if(!FG.wrongThis)FG.first++;FG.times.push(t);FG.flash={[k]:"good"};FG.lastPts=pts;FG.lock=true;beep(true);FG.i++;renderEar();
    setTimeout(()=>{if(!FG.active)return;if(FG.i>=c.n)fgEnd();else fgNext();},450);}
  else{FG.score=Math.max(0,FG.score-25);FG.streak=0;FG.wrongThis++;FG.wrong++;FG.flash[k]="bad";FG.lastPts=-25;beep(false);if(FG.wrongThis>=2)FG.reveal=true;renderEar();}
}
function fgSkip(){if(!FG.active||FG.lock)return;FG.streak=0;FG.wrongThis=9;FG.reveal=true;FG.lock=true;FG.i++;FG.lastPts=0;renderEar();setTimeout(()=>{if(!FG.active)return;if(FG.i>=fgCfg().n)fgEnd();else fgNext();},1500);}
function fgEnd(){
  clearInterval(FG.tIv);if(!FG.active)return;FG.active=false;const c=fgCfg();const n=FG.i;
  if(!n){renderEar();return;}
  const avg=FG.times.length?FG.times.reduce((a,b)=>a+b,0)/FG.times.length:0;const best=fgBest();
  const r={d:todayStr(),key:fgKey(),strings:c.strings.slice(),notes:c.notes,maxFret:c.maxFret,n,first:FG.first,wrong:FG.wrong,score:FG.score,avg:+avg.toFixed(1),record:FG.score>best};
  if(!S.fgHist)S.fgHist=[];S.fgHist.push(r);if(S.fgHist.length>300)S.fgHist.shift();FG.res=r;save();if(r.record)chime();renderEar();
}
function fgClock(){const el=document.getElementById("fgClock");if(el&&FG.active&&!FG.lock)el.textContent=((performance.now()-FG.t0)/1000).toFixed(1)+" s";}
function fbHtml(){
  const c=fgCfg();const pos=FG.reveal?fgPositions(FG.target):[];let h='<div class="fb" role="grid" aria-label="Gitaros grifas"><span></span>';
  [6,5,4,3,2,1].forEach(s=>h+=`<span class="fbh ${FG.active&&s===FG.tStr?'tcolh':''}">${s}</span>`);
  for(let fr=0;fr<=12;fr++){
    h+=`<span class="fbn">${fr}${[3,5,7,9].includes(fr)?'<i>•</i>':fr===12?'<i>••</i>':''}</span>`;
    [6,5,4,3,2,1].forEach((s,si)=>{const on=(FG.active?s===FG.tStr:c.strings.includes(s))&&fr<=c.maxFret;const k=s+":"+fr;const n=NOTES[(STR_MIDI[s]+fr)%12];const fl=FG.flash[k]||(pos.includes(k)?"show":"");
      const lab=(fl||(c.labels&&on))?n:"";const tcol=FG.active&&s===FG.tStr;
      h+=`<button class="fbc ${fr===0?'open':''} ${on?'':'off'} ${tcol?'tcol':''} ${fl}" style="--sw:${(1+ (6-si)*0.35).toFixed(2)}px" data-fs="${s}" data-ff="${fr}" ${on?'':'tabindex="-1" aria-disabled="true"'} aria-label="${s} styga, ${fr} skersinė"><span>${lab}</span></button>`;});
  }
  return h+'</div>';
}
function fgHistHtml(){const H=(S.fgHist||[]).slice(-6).reverse();if(!H.length)return '';
  return '<h3>Paskutiniai žaidimai</h3><div class="hm-wrap"><table class="res"><thead><tr><th>Data</th><th>Stygos</th><th>Taškai</th><th>Iš pirmo</th><th>Vid.</th></tr></thead><tbody>'+H.map(x=>`<tr><td class="mono">${x.d.slice(5)}</td><td>${x.strings.join(",")}</td><td class="mono"><b>${x.score}</b>${x.record?' <span class="pill">rekordas</span>':''}</td><td class="mono">${x.first}/${x.n}</td><td class="mono">${x.avg} s</td></tr>`).join('')+'</tbody></table></div>';}
function renderFG(v){
  const c=fgCfg();
  if(FG.active){
    v.innerHTML=`<div class="fgbar"><div><span class="eyebrow">${FG.i+ (FG.lock?0:1)} / ${c.n}</span><div class="fgt">${FG.target}<span class="fgstr">${FG.tStr} styga</span></div></div>
      <div style="text-align:right"><span class="eyebrow">Taškai</span><div class="mono fgs">${FG.score}</div><span class="mono muted" id="fgClock">0.0 s</span>${FG.streak>1?` <span class="pill">×${(1+Math.min(FG.streak,10)*0.1).toFixed(1)}</span>`:''}</div></div>
      <p class="muted" style="font-size:.88rem;margin:0">${FG.reveal?`Teisingos vietos pažymėtos. Paspauskite vieną iš jų.`:FG.lastPts<0?'Ne ta nata. Bandykite dar.':'Paspauskite natą <b>'+FG.target+'</b> '+FG.tStr+' stygoje.'}</p>
      ${fbHtml()}
      <div class="row"><button class="btn small" id="fgSkip">Nežinau</button><button class="btn small" id="fgStop">Baigti</button></div>`;
    return;
  }
  const R=FG.res;const best=fgBest();
  v.innerHTML=`<div class="head"><span class="eyebrow">Žaidimas be gitaros</span><h1>Rask natą grife</h1><p class="muted">Programėlė parodo natą ir stygą, pvz. „D, 5 styga“, o jūs paspaudžiate ją grife. Greitas teisingas atsakymas duoda iki 200 taškų, serija iš eilės juos padaugina, klaida atima 25.</p></div>
   ${R?`<div class="metro" style="gap:10px"><span class="eyebrow">Rezultatas</span><div class="bpm">${R.score}</div>${R.record?'<span class="pill">Naujas rekordas!</span>':`<span class="muted">Rekordas: ${best}</span>`}
     <div class="rgrid"><div class="stat"><b>${R.first}/${R.n}</b><small>iš pirmo karto</small></div><div class="stat"><b>${R.avg} s</b><small>vid. laikas natai</small></div></div></div>`:''}
   <div class="theory" style="gap:10px">
    <span class="eyebrow">Stygos</span><div class="row" style="justify-content:flex-start">${[6,5,4,3,2,1].map(s=>`<button class="btn small" data-fgs="${s}" ${tog(c.strings.includes(s))}>${s}</button>`).join('')}</div>
    <span class="eyebrow">Natos</span><div class="row" style="justify-content:flex-start"><button class="btn small" data-fgn="natural" ${tog(c.notes==='natural')}>Be diezų</button><button class="btn small" data-fgn="all" ${tog(c.notes==='all')}>Visos 12</button></div>
    <span class="eyebrow">Skersinės</span><div class="row" style="justify-content:flex-start"><button class="btn small" data-fgf="5" ${tog(c.maxFret===5)}>0–5</button><button class="btn small" data-fgf="12" ${tog(c.maxFret===12)}>0–12</button></div>
    <span class="eyebrow">Natų skaičius</span><div class="row" style="justify-content:flex-start">${[10,20,30].map(n=>`<button class="btn small" data-fgl="${n}" ${tog(c.n===n)}>${n}</button>`).join('')}</div>
    <span class="eyebrow">Mokymosi režimas</span><div class="row" style="justify-content:flex-start"><button class="btn small" data-fglab="1" ${tog(c.labels)}>${c.labels?'Natų pavadinimai rodomi':'Natų pavadinimai paslėpti'}</button></div>
    <span class="muted" style="font-size:.88rem">Natos šiame žaidime: ${fgPoolNotes().join(" ")}${best?` · rekordas su šiais nustatymais: <b>${best}</b>`:''}</span>
    <button class="btn primary" id="fgStart">${R?'Žaisti dar kartą':'Pradėti'}</button></div>
   ${fgHistHtml()}`;
}
function fgClick(t){
  if(t.dataset.fs){fgTap(+t.dataset.fs,+t.dataset.ff);return true;}
  if(t.id==="fgStart"){fgStart();return true;}
  if(t.id==="fgSkip"){fgSkip();return true;}
  if(t.id==="fgStop"){fgEnd();return true;}
  const c=fgCfg();
  if(t.dataset.fgs){const s=+t.dataset.fgs;c.strings=c.strings.includes(s)?c.strings.filter(x=>x!==s):[...c.strings,s];save();renderEar();return true;}
  if(t.dataset.fgn){c.notes=t.dataset.fgn;save();renderEar();return true;}
  if(t.dataset.fgf){c.maxFret=+t.dataset.fgf;save();renderEar();return true;}
  if(t.dataset.fgl){c.n=+t.dataset.fgl;save();renderEar();return true;}
  if(t.dataset.fglab){c.labels=!c.labels;save();renderEar();return true;}
  if(t.dataset.grmode){if(FG.active)fgEnd();S.grMode=t.dataset.grmode;save();renderEar();return true;}
  return false;
}

function renderEar(){const v=document.getElementById("v-ear");if(P.round&&!P.round.inline){renderEarMic();return;}
  if(S.grMode==="game")renderFG(v);else renderEarMic();
  if(!FG.active)v.insertAdjacentHTML("afterbegin",`<div class="row" style="justify-content:flex-start"><button class="btn small" data-grmode="mic" ${tog(S.grMode!=="game")}>Su gitara (mikrofonas)</button><button class="btn small" data-grmode="game" ${tog(S.grMode==="game")}>Žaidimas ekrane</button></div>`);}

function renderAll(){renderToday();renderGoals();renderTheory();renderMetro();if(!P.round)renderEar();renderEarTrain();renderCal();}
function render(){renderAll();}
renderAll();
// refresh at midnight / when returning to the app
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!T.running){renderToday();}});
</script>
