<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B6A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gitara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gitaros pratybos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, fixed bottom tab bar, four views (Šiandien / Tikslai / Teorija / Metronomas) */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --line:#D5DDD8; --fg:#16201B; --muted:#58675F;
  --accent:#2B6A4C; --accent-ink:#FFFFFF; --brass:#9A6F12; --brass-soft:#F4E9CF; --done:#2B6A4C; --warn:#A5461F;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#17201B; --line:#2A362F; --fg:#E6EDE8; --muted:#94A49B;
  --accent:#6CC297; --accent-ink:#0E1411; --brass:#E2B54F; --brass-soft:#2E2715; --done:#6CC297; --warn:#F08A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#17201B; --line:#2A362F; --fg:#E6EDE8; --muted:#94A49B;
  --accent:#6CC297; --accent-ink:#0E1411; --brass:#E2B54F; --brass-soft:#2E2715; --done:#6CC297; --warn:#F08A5D; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:6px;padding-block:4px 14px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* fretboard progress strip: 14 frets = 14 days of the stage */
.fret{display:grid;grid-template-columns:repeat(14,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.fret span{height:26px;border-right:2px solid var(--line);position:relative}
.fret span:last-child{border-right:0}
.fret span.on::after{content:"";position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.fret span.today{background:var(--brass-soft)}
.fret span.inlay::before{content:"";position:absolute;left:50%;bottom:2px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--muted);opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.78rem}

/* exercises */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ex[open]{border-color:var(--accent)}
.ex summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.ex summary::-webkit-details-marker{display:none}
.chk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--accent-ink)}
.ex.done .chk{background:var(--done);border-color:var(--done)}
.ex.done .chk::after{content:"✓";font-weight:700}
.ex .t{flex:1;min-width:0}
.ex .t h3{font-size:1rem}
.ex.done .t h3{color:var(--muted)}
.ex .min{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ex .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:5.2ch}
.clock.run{color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brass-soft);color:var(--brass)}

/* goals */
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.goal input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.goal label{flex:1;min-width:0}
.road{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px}
.road li{list-style:none;position:relative;padding:0 0 14px 18px}
.road li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.road li.past::before{background:var(--done);border-color:var(--done)}
.road li.cur::before{background:var(--brass);border-color:var(--brass)}
.road ul{padding:0;margin:0}
.note{background:var(--brass-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* theory */
.theory{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:65ch}
.theory code,.theory .k{font-family:var(--f-mono);font-size:.92em;background:var(--bg);padding:1px 5px;border-radius:4px}
.scale{display:flex;flex-wrap:wrap;gap:4px}
.scale span{font-family:var(--f-mono);font-size:.85rem;padding:4px 7px;border-radius:6px;border:1px solid var(--line)}
.scale span.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.other{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.other summary{cursor:pointer;font-weight:700}

/* metronome */
.metro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px;align-items:center}
.bpm{font-family:var(--f-mono);font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.beats{display:flex;gap:10px}
.beats i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.beats i.on{background:var(--accent);border-color:var(--accent)}
.beats i.on.first{background:var(--brass);border-color:var(--brass)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:none;padding:10px 1px 12px;font-size:.68rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;max-width:90vw}
.target{font-family:var(--f-display);font-size:5rem;font-weight:700;line-height:1;transition:transform .2s,color .2s}
.target.ok{color:var(--done);transform:scale(1.15)}
.strlabel{font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--brass)}
.heard{font-weight:700;min-height:1.5em;color:var(--muted)}.heard.good{color:var(--done)}.heard.bad{color:var(--warn)}
.wrongtag{font-weight:700;color:var(--warn)}
.hm-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.hm{border-collapse:collapse;font-family:var(--f-mono);font-size:.72rem;width:100%;min-width:420px}
.hm th{color:var(--muted);font-weight:500;padding:4px 2px}
.hm td{text-align:center;padding:6px 1px;border-left:2px solid var(--line);color:var(--muted)}
.hm tr.off td{opacity:.35}
.hm td.good{background:color-mix(in srgb,var(--done) 30%,transparent);color:var(--fg)}
.hm td.mid{background:color-mix(in srgb,var(--brass) 30%,transparent);color:var(--fg)}
.hm td.slow{background:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--fg)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:middle}
.lg.good{background:var(--done)}.lg.mid{background:var(--brass)}.lg.slow{background:var(--warn)}
table.res{border-collapse:collapse;width:100%;font-size:.9rem}
.res th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.eopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.eopt{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.eopt small{font-weight:400;color:var(--muted);font-size:.78rem;text-align:center}
.eopt.right{border-color:var(--done);background:color-mix(in srgb,var(--done) 18%,var(--surface))}
.eopt.wrongb{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.efb{text-align:center;min-height:1.5em}.efb.good{color:var(--done)}.efb.bad{color:var(--warn)}
.efb .muted{font-size:.88rem}
.btn.play{font-size:1.15rem;min-width:200px;min-height:56px;border-radius:14px}
.drill{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--bg);border-radius:12px;padding:14px}
.drill .target{font-size:4rem}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;text-align:left}
.tips{margin:0;padding-left:18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.rbeats i.on{background:var(--accent);border-color:var(--accent)}
.rbeats i.on.first{background:var(--brass);border-color:var(--brass)}
.calb{display:flex;flex-direction:column;align-items:center;min-width:58px;gap:0}
.calb small{font-family:var(--f-mono);font-size:.72rem;font-weight:500}
.calb.okc{border-color:var(--done);color:var(--done)}
.calb.warnc{border-color:var(--brass);color:var(--brass)}
.calb.live{background:var(--brass-soft)}
.res td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <section id="v-today" class="stack"></section>
  <section id="v-goals" class="stack" hidden></section>
  <section id="v-theory" class="stack" hidden></section>
  <section id="v-metro" class="stack" hidden></section>
  <section id="v-ear" class="stack" hidden></section>
  <section id="v-ear2" class="stack" hidden></section>
  <section id="v-cal" class="stack" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<nav class="tabs" role="tablist">
  <button role="tab" data-v="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Šiandien</button>
  <button role="tab" data-v="goals" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Tikslai</button>
  <button role="tab" data-v="theory" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Teorija</button>
  <button role="tab" data-v="metro" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 3h8l4 18H4zM12 17l5-11M7 15h10"/></svg>Tempas</button>
  <button role="tab" data-v="ear" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 10h18M3 14h18M3 18h18M8 4v16M14 4v16"/><circle cx="11" cy="12" r="2" fill="currentColor"/></svg>Grifas</button>
  <button role="tab" data-v="ear2" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 3-2 4-3 5.5S14 18 12 19.5 8 21 7 19"/><path d="M10 9a2 2 0 1 1 4 0c0 1.5-2 2-2 3.5"/></svg>Klausa</button>
</nav>

<script>
"use strict";
const NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function scaleRow(hl){return '<div class="scale">'+NOTES.map(n=>'<span class="'+(hl.includes(n)?'hl':'')+'">'+n+'</span>').join('')+'</div>';}

const PHASES=[
{title:"Pirštų sugrįžimas ir grifas",
 focus:"Grąžiname pirštams jėgą ir išmokstame, kur gitaroje yra natos.",
 theory:`<h3>12 natų</h3><p>Muzikoje yra tik 12 skirtingų garsų. Jie kartojasi vis aukščiau (oktavomis):</p>${scaleRow(["C","D","E","F","G","A","B"])}
 <p>Atstumas tarp dviejų gretimų garsų yra <b>pustonis</b>. Du pustoniai yra <b>tonas</b>. Tarp <span class="k">E–F</span> ir <span class="k">B–C</span> nėra diezo, ten tik pustonis.</p>
 <h3>Gitaroje</h3><p>Viena skersinė (ladas) = vienas pustonis. Atviros stygos nuo storiausios: <span class="k">E A D G B E</span>. 12-oje skersinėje natos pradeda kartotis iš naujo.</p>
 <p>Pavyzdys 6 stygoje: 0 E, 1 F, 3 G, 5 A, 7 B, 8 C, 10 D, 12 E.</p>
 <h3>Ritmas</h3><p>Groti pagal metronomą reiškia vieną smūgį ar natą vienam tvaksniui. Skaičiuokite garsiai: <span class="k">1 2 3 4</span>.</p>
 <p class="muted">Pirmomis dienomis pirštų galiukai skaudės, tai normalu. Geriau 2 trumpos sesijos per dieną nei viena ilga.</p>`,
 ex:[
  {id:"warm",n:"Apšilimas",m:2,h:"Pagniaužykite kumštį, patempkite pirštus atgal, pakratykite riešus. Pečiai atpalaiduoti."},
  {id:"chrom",n:"Chromatinis 1-2-3-4",m:5,bpm:60,h:"Kiekvienoje stygoje paspauskite 1, 2, 3, 4 skersines 1, 2, 3, 4 pirštais, nuo 6 stygos iki 1 ir atgal. Viena nata vienam tvaksniui. Pirštai arti stygų, spausti tik tiek, kad skambėtų švariai."},
  {id:"notes65",n:"Natos 6 ir 5 stygoje",m:4,drill:true,h:"Paspauskite „Pradėti“: programėlė atsitiktine tvarka rodys natą ir stygą. Suraskite ir sugrokite ją, sakydami pavadinimą garsiai. Mikrofonas patikrins, ar nata teisinga, ir pamatuos laiką."},
  {id:"emam",n:"Akordai Em ir Am",m:5,bpm:60,changes:[["Em","Am"]],h:"Išmokite pirštuotę. Tada grokite po 4 smūgius žemyn kiekvienam akordui pagal metronomą. Pirmiausia tikrinkite, ar skamba visos stygos."},
  {id:"min1",n:"Vienos minutės keitimai",m:1,changes:[["Em","Am"]],h:"Per minutę keiskite Em ↔ Am kuo daugiau kartų, bet švariai: po kiekvieno keitimo vieną kartą užgaukite visas stygas. Programėlė skaičiuoja keitimus ir mikrofonu tikrina, ar suskambo visos akordo natos."}
 ],
 goals:["Chromatinis pratimas visose stygose švariai 60 bpm","Bet kurią natą 6 ir 5 stygoje randu per 3 sekundes","Em ↔ Am: 30 švarių keitimų per minutę","Galiu paaiškinti, kas yra pustonis ir tonas, ir kur nėra diezų"]},

{title:"Majorinė gama ir atviri akordai",
 focus:"Suprantame, kaip sudaroma gama, ir išmokstame pagrindinius akordus.",
 theory:`<h3>Gama yra formulė</h3><p><b>Majorinė gama</b> sudaroma pagal žingsnius: <span class="k">T T P T T T P</span> (T tonas, P pustonis).</p>
 <p>Nuo C gaunasi C D E F G A B C, be jokių diezų:</p>${scaleRow(["C","D","E","F","G","A","B"])}
 <p>Nuo G: G A B C D E <b>F#</b> G. Formulė priverčia F pakelti į F#.</p>${scaleRow(["G","A","B","C","D","E","F#"])}
 <h3>Laipsniai</h3><p>Gamos natos numeruojamos 1–7. C majore 1 = C, 3 = E, 5 = G. Šie numeriai bus raktas į akordus kitame etape.</p>
 <h3>Ritmas</h3><p>Aštuntinės: du smūgiai vienam tvaksniui. Skaičiuokite <span class="k">1 ir 2 ir 3 ir 4 ir</span>: ant skaičių žemyn, ant „ir“ aukštyn.</p>`,
 ex:[
  {id:"warm",n:"Apšilimas",m:2,h:"Kaip ir anksčiau, plius 1 ratas chromatinio pratimo be metronomo."},
  {id:"chrom",n:"Chromatinis 1-2-3-4",m:3,bpm:70,h:"Dabar 70 bpm. Jei švaru, pabandykite aštuntinėmis 50 bpm."},
  {id:"scale1",n:"C majoras vienoje stygoje",m:4,h:"2 (B) styga: pradėkite nuo 1 skersinės (C) ir eikite pagal T T P T T T P iki 13 skersinės. Sakykite natų pavadinimus."},
  {id:"scaleopen",n:"C majoras pirmoje pozicijoje",m:4,bpm:60,h:"5 st. 3 sk. (C), 4 st. 0, 2, 3 (D E F), 3 st. 0, 2 (G A), 2 st. 0, 1 (B C). Aukštyn ir žemyn, viena nata vienam tvaksniui."},
  {id:"cgd",n:"Akordai C, G, D",m:5,bpm:70,changes:[["G","C"],["C","D"],["G","D"]],h:"Keitimai G ↔ C, C ↔ D, G ↔ D. Ritmas aštuntinėmis žemyn-aukštyn. Atlikite ir vienos minutės keitimų testą G ↔ C."},
  {id:"prog1",n:"Progresija G–C–D–Em",m:4,bpm:70,h:"Po vieną taktą (4 tvaksniai) kiekvienam akordui. Nesustokite, net jei suklystate. Ritmas svarbiau už tobulą akordą."}
 ],
 goals:["C majoro gamą groju aukštyn ir žemyn 70 bpm be klaidų","Pagal T T P T T T P galiu užrašyti D ir A majoro gamų natas","G ↔ C: 30 švarių keitimų per minutę","Progresiją G–C–D–Em groju aštuntinėmis 70 bpm nesustodamas"]},

{title:"Intervalai ir kaip gimsta akordai",
 focus:"Suprantame, iš ko sudarytas akordas, ir kodėl dainose kartojasi tie patys akordai.",
 theory:`<h3>Intervalai</h3><p>Intervalas yra atstumas tarp dviejų natų pustoniais: <b>mažoji tercija</b> 3, <b>didžioji tercija</b> 4, <b>grynoji kvinta</b> 7, <b>oktava</b> 12.</p>
 <h3>Trigarsis = 1, 3, 5</h3><p>Akordas yra gamos 1, 3 ir 5 natos. <b>Majorinis</b>: didžioji tercija + mažoji (C E G). <b>Minorinis</b>: mažoji + didžioji (A C E). Majoras skamba šviesiai, minoras liūdniau.</p>${scaleRow(["C","E","G"])}
 <h3>Tonacijos akordai</h3><p>Ant kiekvienos gamos natos statome trigarsį, naudodami tik gamos natas. C majore gaunasi:</p>
 <p><span class="k">I C · ii Dm · iii Em · IV F · V G · vi Am · vii° Bdim</span></p>

const EAR_MAP={"0:notes65":1};
[["hl","Klausa: aukščiau ar žemiau ir natą į gitarą",3,"Pradėkite nuo „Aukščiau ar žemiau“. Kai pasieksite 3 lygį, pereikite prie „Natą į gitarą“ su atviromis stygomis."],
 ["iv","Klausa: intervalai",4,"Pradėkite nuo oktavos ir kvintos. Prieš atsakydami tyliai padainuokite abi natas."],
 ["iv","Klausa: intervalai ir akordai",4,"Intervalai aukštyn ir žemyn, tada majoras ar minoras skiltyje „Akordai“."],
 ["ch","Klausa: akordai",4,"Majoras, minoras ir 7. Klausykite akordo „nuotaikos“."],
 ["ch","Klausa: septakordai",4,"Maj7, m7 ir 7: aukštesni akordų lygiai."],
 ["pr","Klausa: progresijos",5,"Atpažinkite I–IV–V ir I–V–vi–IV. Tai raktas į dainų mokymąsi iš klausos."]].forEach((x,i)=>{PHASES[i].ex.push({id:"eartr",n:x[1],m:x[2],h:x[3],eartr:x[0]});});
/* ---------- state ---------- */
const KEY="gitara-pratybos-v1";
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysBetween(a,b){const pa=a.split("-").map(Number),pb=b.split("-").map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5);}
function fresh(){return {phase:0,phaseStart:todayStr(),goals:{},log:{},done:{},updatedAt:0};}
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}

let dbRef=null,saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbRef){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{});},800);}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    dbRef=db.doc("data/users/"+uid+"/progress");
    const snap=await dbRef.get();
    if(snap.exists){const d=snap.data()||{};if((d.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(fresh(),d);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();}else if((S.updatedAt||0)>(d.updatedAt||0)){dbRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{});}}
    else if(S.updatedAt){dbRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{});}
  }catch(e){}
})();

function doneToday(){const t=todayStr();return (S.done[t]||[]);}
function secsToday(){return S.log[todayStr()]||0;}
function addSecs(s){if(s<=0)return;const t=todayStr();S.log[t]=(S.log[t]||0)+Math.round(s);}
function markDone(id,on){const t=todayStr();const a=new Set(S.done[t]||[]);on?a.add(id):a.delete(id);S.done[t]=[...a];}
function streak(){let n=0;const d=new Date();if(!S.log[todayStr(d)])d.setDate(d.getDate()-1);while(S.log[todayStr(d)]>=60){n++;d.setDate(d.getDate()-1);}return n;}
function phaseGoals(){return S.goals[S.phase]||[];}

/* ---------- audio ---------- */
let AC=null;
let unlocked=false;
function silentWav(){const n=800,b=new Uint8Array(44+n*2),v=new DataView(b.buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);let s="";b.forEach(x=>s+=String.fromCharCode(x));return "data:audio/wav;base64,"+btoa(s);}
function unlock(){if(unlocked)return;unlocked=true;try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}try{const a=new Audio(silentWav());a.loop=true;a.setAttribute("playsinline","");a.volume=0.01;a.play().catch(()=>{});}catch(e){}}
function ac(){unlock();if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==="suspended")AC.resume();if(AC&&!ac.primed){ac.primed=true;try{const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0.0001;o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+0.02);}catch(e){}}return AC;}
function click(time,accent){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=accent?1760:1175;g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(accent?0.6:0.4,time+0.002);g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);o.connect(g).connect(a.destination);o.start(time);o.stop(time+0.06);}
function chime(){const a=ac();if(!a)return;const t=a.currentTime;[659.25,783.99,987.77].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*0.18);g.gain.exponentialRampToValueAtTime(0.4,t+i*0.18+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.18+0.6);o.connect(g).connect(a.destination);o.start(t+i*0.18);o.stop(t+i*0.18+0.65);});}

let wake=null;
async function wakeOn(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}}catch(e){}}
function wakeOff(){if(!T.running&&!M.running&&!(typeof P!=="undefined"&&P.on)&&wake){wake.release().catch(()=>{});wake=null;}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(T.running||M.running))wakeOn();});

/* ---------- timer ---------- */
const T={id:null,total:0,left:0,running:false,last:0,iv:null,spent:0};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function timerFor(ex){if(T.id!==ex.id){if(T.running)pauseT();T.id=ex.id;T.total=ex.m*60;T.left=T.total;T.spent=0;}}
function startT(ex){ac();if(ex.changes&&!CH2.active&&!RM.active){rmCfg().mode==="rhythm"?startRhythm(ex):startChanges(ex);}if(ex.drill&&!(P.round&&P.round.inline))startInline();timerFor(ex);if(T.left<=0)T.left=T.total;if(ex.bpm&&S.metroWithTimer!==false&&!ex.changes){setBpm(ex.bpm);if(!M.running){startM();M.byTimer=true;}}T.running=true;T.last=performance.now();clearInterval(T.iv);T.iv=setInterval(tick,250);wakeOn();paintTimer();}
function stopTimerMetro(){if(M.byTimer){M.byTimer=false;stopM();}}
function pauseT(){if(!T.running)return;tick();T.running=false;clearInterval(T.iv);stopTimerMetro();if(P.round&&P.round.inline)endRound();if(CH2.active)endChanges();if(RM.active)endRhythm();flushSpent();wakeOff();paintTimer();}
function resetT(ex){pauseT();T.id=ex.id;T.total=ex.m*60;T.left=T.total;T.spent=0;paintTimer();}
function flushSpent(){if(T.spent>0){addSecs(T.spent);T.spent=0;save();paintStats();}}
function tick(){if(!T.running)return;const now=performance.now();const dt=(now-T.last)/1000;T.last=now;T.left-=dt;T.spent+=dt;
  if(T.left<=0){T.left=0;T.running=false;clearInterval(T.iv);stopTimerMetro();if(P.round&&P.round.inline)endRound();if(CH2.active)endChanges();if(RM.active)endRhythm();flushSpent();markDone(T.id,true);save();chime();toast("Laikas baigėsi. Pratimas atliktas!");wakeOff();renderToday();return;}
  paintTimer();}
function paintTimer(){document.querySelectorAll("[data-clock]").forEach(el=>{const id=el.dataset.clock;const ex=curEx().find(e=>e.id===id);if(!ex)return;const tot=ex.m*60;const left=T.id===id?T.left:tot;el.textContent=fmt(left);el.classList.toggle("run",T.id===id&&T.running);const bar=document.querySelector('[data-bar="'+id+'"]');if(bar)bar.style.width=((1-left/tot)*100)+"%";const b=document.querySelector('[data-start="'+id+'"]');if(b)b.textContent=(T.id===id&&T.running)?"Pauzė":(T.id===id&&left<tot&&left>0?"Tęsti":"Pradėti");});}

function curEx(){return PHASES[S.phase].ex;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},2600);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- views ---------- */
function stageHeader(){
  const p=PHASES[S.phase];const day=Math.min(14,daysBetween(S.phaseStart,todayStr())+1);
  return `<div class="head"><span class="eyebrow">${S.phase+1} etapas iš ${PHASES.length} · ${day}-a diena iš 14</span><h1>${esc(p.title)}</h1><p class="muted">${esc(p.focus)}</p></div>`;
}
function fretStrip(){
  let h='<div class="fret" aria-label="14 etapo dienų">';
  for(let i=0;i<14;i++){const d=new Date(S.phaseStart+"T12:00:00");d.setDate(d.getDate()+i);const k=todayStr(d);const on=(S.log[k]||0)>=60;const inl=[2,4,6,8,11].includes(i);h+=`<span class="${on?'on ':''}${k===todayStr()?'today ':''}${inl?'inlay':''}" title="${k}"></span>`;}
  return h+'</div>';
}
function statsHtml(){
  const plan=curEx().reduce((a,e)=>a+e.m,0);const g=phaseGoals().filter(Boolean).length;
  return `<div class="stats" id="stats"><div class="stat"><b>${Math.floor(secsToday()/60)}/${plan}</b><small>min šiandien</small></div><div class="stat"><b>${streak()}</b><small>dienų iš eilės</small></div><div class="stat"><b>${g}/${PHASES[S.phase].goals.length}</b><small>tikslų pasiekta</small></div></div>`;
}
function paintStats(){const el=document.getElementById("stats");if(el)el.outerHTML=statsHtml();}

function renderToday(){
  const v=document.getElementById("v-today");const dn=doneToday();const open=v.querySelector("details[open]");const openId=open?open.dataset.id:null;
  let h=stageHeader()+`<button class="btn small" id="calOpen" style="align-self:flex-start">${calReady()?"Gitaros pritaikymas ✓":"Pritaikyti programėlę savo gitarai"}</button>`+fretStrip()+statsHtml()+'<h2 style="margin-top:8px">Šiandienos pratimai</h2>';
  curEx().forEach(ex=>{
    const d=dn.includes(ex.id);

      <summary><span class="chk" aria-hidden="true"></span><span class="t"><h3>${esc(ex.n)}</h3>${ex.bpm?`<span class="pill">${ex.bpm} bpm</span>`:''}</span><span class="min">${ex.m} min</span></summary>
      <div class="body"><p>${esc(ex.h)}</p>
        <div class="timer"><span class="clock" data-clock="${ex.id}">${fmt(ex.m*60)}</span>
          <button class="btn primary" data-start="${ex.id}">Pradėti</button>
          <button class="btn small" data-reset="${ex.id}">Iš naujo</button></div>

        ${ex.drill?`<div class="drill" id="drillBox">${drillHtml()}</div>`:''}

        <div class="row" style="justify-content:flex-start">
          ${ex.bpm?`<button class="btn small" data-mwt="1" aria-pressed="${S.metroWithTimer!==false}">Metronomas su laikmačiu: ${S.metroWithTimer!==false?'įjungtas':'išjungtas'}</button><button class="btn small" data-metro="${ex.bpm}">Atidaryti metronomą</button>`:''}
          ${ex.eartr?`<button class="btn small" data-eartr="${ex.eartr}">Atidaryti klausos treniruotę</button>`:''}
          ${EAR_MAP[S.phase+":"+ex.id]?`<button class="btn small" data-ear="1">Natų treniruoklis su mikrofonu</button>`:''}

let confirmNext=false;
function renderGoals(){

/* ---------- grifo natų treniruoklis su mikrofonu ---------- */
const STR_MIDI={6:40,5:45,4:50,3:55,2:59,1:64};
const NATURAL=["C","D","E","F","G","A","B"];
const P={on:false,stream:null,src:null,an:null,buf:null,raf:0,round:null,hist:[],okSince:0,badSince:0,last:null,tickIv:null};
function trCfg(){if(!S.tr)S.tr={strings:[6,5],notes:"natural",maxFret:12,len:20};return S.tr;}
function trCells(){if(!S.trCells)S.trCells={};return S.trCells;}
function trHist(){if(!S.trHist)S.trHist=[];return S.trHist;}
function noteFromFreq(f){const x=12*Math.log2(f/440)+69;const r=Math.round(x);return {midi:r,pc:((r%12)+12)%12,name:NOTES[((r%12)+12)%12],oct:Math.floor(r/12)-1,cents:Math.round((x-r)*100)};}
function detectPitch(buf,sr){
  const N=buf.length;let rms=0;for(let i=0;i<N;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/N);if(rms<0.012)return -1;
  const minLag=Math.floor(sr/1100),maxLag=Math.min(N>>1,Math.floor(sr/65));
  const n=new Float32Array(maxLag+2);
  for(let lag=0;lag<=maxLag+1;lag++){let r=0,m=0;for(let j=0;j<N-lag;j++){const a=buf[j],b=buf[j+lag];r+=a*b;m+=a*a+b*b;}n[lag]=m>0?2*r/m:0;}
  let d=minLag;while(d<maxLag&&n[d]>0)d++;
  let best=-1;for(let i=d;i<=maxLag;i++)if(n[i]>best)best=n[i];
  if(best<0.6)return -1;
  let pos=-1;for(let i=Math.max(d,1);i<=maxLag;i++){if(n[i]>n[i-1]&&n[i]>=n[i+1]&&n[i]>=0.9*best){pos=i;break;}}
  if(pos<1)return -1;
  const x1=n[pos-1],x2=n[pos],x3=n[pos+1];const a=(x1+x3-2*x2)/2,b=(x3-x1)/2;const T0=a?pos-b/(2*a):pos;
  const f=sr/T0;return (f>60&&f<1200)?f:-1;
}
function cellPool(){const c=trCfg();const out=[];c.strings.forEach(s=>{for(let fr=0;fr<=c.maxFret;fr++){const m=STR_MIDI[s]+fr;const n=NOTES[m%12];if(c.notes==="natural"&&!NATURAL.includes(n))continue;out.push({s,fr,m,n});}});return out;}
function poolNotes(){return [...new Set(cellPool().map(x=>x.n))].sort((a,b)=>NOTES.indexOf(a)-NOTES.indexOf(b));}
function pickCell(prev){
  const pool=cellPool();if(!pool.length)return null;const st=trCells();
  // dažniau rodome lėtas ir klaidingas vietas
  const w=pool.map(x=>{const k=x.s+":"+x.fr;const r=st[k];let v=r?1+Math.min(4,(r.sum/r.n)/2)+r.err*1.5/Math.max(1,r.n):2.5;if(prev&&prev.n===x.n&&prev.s===x.s)v=0;return v;});
  const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}return pool[pool.length-1];
}
function accepts(cell,midi){
  // ta pati nata toje pačioje stygoje (0 ir 12 sk. abu tinka); žemoms stygoms toleruojame oktavos klaidą
  const c=trCfg();const ok=[];for(let fr=0;fr<=c.maxFret;fr++){const m=STR_MIDI[cell.s]+fr;if(m%12===cell.m%12)ok.push(m);}
  if(ok.includes(midi))return true;
  if(cell.m<52&&ok.some(m=>m+12===midi))return true;
  return false;
}
function beep(ok){const a=ac();if(!a)return;const t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=ok?1318.5:220;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.22);}

async function micOn(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Ši naršyklė neleidžia naudoti mikrofono.");return false;}
  try{if(navigator.audioSession)navigator.audioSession.type="play-and-record";}catch(e){}
  const a=ac();
  try{P.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
  catch(e){toast("Mikrofonas neleistas. Leiskite jį naršyklės nustatymuose.");return false;}
  P.src=a.createMediaStreamSource(P.stream);P.an=a.createAnalyser();P.an.fftSize=2048;P.src.connect(P.an);P.buf=new Float32Array(P.an.fftSize);
  P.on=true;P.hist=[];wakeOn();loop();return true;
}
function micOff(){P.on=false;cancelAnimationFrame(P.raf);clearInterval(P.tickIv);try{P.stream&&P.stream.getTracks().forEach(t=>t.stop());}catch(e){}try{P.src&&P.src.disconnect();}catch(e){}P.stream=null;try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}wakeOff();}

async function startRound(){
  if(!cellPool().length){toast("Pasirinkite bent vieną stygą.");return;}
  if(!P.on&&!(await micOn()))return;
  P.round={items:[],cur:null,len:trCfg().len,started:Date.now()};nextItem();renderEar();
  clearInterval(P.tickIv);P.tickIv=setInterval(paintClock,100);
}
function nextItem(){const R=P.round;const prev=R.cur?R.cur.cell:null;R.cur={cell:pickCell(prev),t0:performance.now(),wrong:false,hint:false};P.okSince=0;P.badSince=0;P.hist=[];paintRound();}
function finishItem(ok,skipped){
  const R=P.round;const it=R.cur;const t=(performance.now()-it.t0)/1000;
  const rec={n:it.cell.n,s:it.cell.s,fr:it.cell.fr,t:+t.toFixed(2),first:ok&&!it.wrong,skip:!!skipped};R.items.push(rec);
  const k=it.cell.s+":"+it.cell.fr;const st=trCells();const r=st[k]||{n:0,sum:0,err:0};
  if(!skipped){r.n++;r.sum+=Math.min(t,15);}if(it.wrong||skipped)r.err++;st[k]=r;
  if(ok)beep(true);
  const el=document.getElementById("trNote");if(el&&ok){el.classList.add("ok");}

function endRound(){

  const done=R.items.filter(x=>!x.skip);const avg=done.length?done.reduce((a,b)=>a+b.t,0)/done.length:0;
  const first=R.items.filter(x=>x.first).length;
  const res={d:todayStr(),n:R.items.length,first,avg:+avg.toFixed(2),strings:trCfg().strings.slice(),notes:trCfg().notes};
  trHist().push(res);if(S.trHist.length>200)S.trHist.shift();
  if(!R.inline)addSecs((Date.now()-R.started)/1000);
  P.lastRes={res,items:R.items,inline:!!R.inline};P.round=null;save();micOff();if(!R.inline)chime();renderEar();const db=document.getElementById("drillBox");if(db)db.innerHTML=drillHtml();paintStats&&paintStats();
}
function stopRound(){if(P.round&&P.round.items.length>0){endRound();}else{P.round=null;clearInterval(P.tickIv);micOff();renderEar();}}

let frameFlip=false;
function loop(){
  if(!P.on)return;P.raf=requestAnimationFrame(loop);if(CAL.active){calFrame();return;}if(RM.active){if(P.anLow)rhythmFrame();return;}if(CH2.active){chordFrame();return;}frameFlip=!frameFlip;if(frameFlip)return;
  P.an.getFloatTimeDomainData(P.buf);const f=detectPitch(P.buf,AC.sampleRate);
  P.hist.push(f<0?null:noteFromFreq(f));if(P.hist.length>5)P.hist.shift();
  const vals=P.hist.filter(Boolean);let st=null;
  if(vals.length>=3){const cnt={};vals.forEach(v=>cnt[v.midi]=(cnt[v.midi]||0)+1);const top=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];if(cnt[top]>=3)st=vals.filter(v=>v.midi==top).pop();}
  if(!P.round){earStable(st);return;}
  const R=P.round;const heard=document.getElementById("trHeard");
  if(heard)heard.textContent=st?"Girdžiu: "+st.name+st.oct:(P.on?"Klausau…":"");
  if(!R||!R.cur||R.cur.done||!st){if(!st){P.okSince=0;P.badSince=0;}return;}
  const now=performance.now();
  if(accepts(R.cur.cell,st.midi)){P.badSince=0;if(heard)heard.className="heard good";if(!P.okSince)P.okSince=now;else if(now-P.okSince>200)finishItem(true,false);}
  else{P.okSince=0;if(heard)heard.className="heard bad";if(!P.badSince)P.badSince=now;else if(now-P.badSince>350&&!R.cur.wrong){R.cur.wrong=true;beep(false);paintRound();}}
}
function paintClock(){const R=P.round;const el=document.getElementById("trClock");if(!R||!R.cur||!el)return;if(R.cur.done)return;const t=(performance.now()-R.cur.t0)/1000;el.textContent=t.toFixed(1)+" s";
  if(t>6&&!R.cur.hint){R.cur.hint=true;const h=document.getElementById("trHint");if(h)h.textContent="Užuomina: "+R.cur.cell.fr+" skersinė";}}

function heatColor(r){if(!r||!r.n)return "";const a=r.sum/r.n;const e=r.err/Math.max(1,r.n+r.err);if(a<=3&&e<.2)return "good";if(a<=6)return "mid";return "slow";}
function heatmap(){
  const c=trCfg();const st=trCells();let h='<div class="hm-wrap"><table class="hm"><thead><tr><th></th>';

}
function histHtml(){

function tog(on){return on?'style="border-color:var(--accent);color:var(--accent)" aria-pressed="true"':'aria-pressed="false"';}

function pluck(midi,when,dur,vol){
  const a=ac();if(!a)return;const sr=a.sampleRate;const f=440*Math.pow(2,(midi-69)/12);
  const len=Math.floor(sr*dur);const buf=a.createBuffer(1,len,sr);const d=buf.getChannelData(0);
  const N=Math.max(2,Math.round(sr/f));const ring=new Float32Array(N);
  for(let i=0;i<N;i++)ring[i]=(Math.random()*2-1)*0.9;
  let idx=0,prev=0;const decay=midi<52?0.998:0.996;
  for(let i=0;i<len;i++){const cur=ring[idx];const nxt=ring[(idx+1)%N];const v=decay*0.5*(cur+nxt);ring[idx]=v;d[i]=cur;idx=(idx+1)%N;}
  const src=a.createBufferSource();src.buffer=buf;const g=a.createGain();const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;
  g.gain.setValueAtTime(vol||0.5,when);g.gain.setValueAtTime(vol||0.5,when+dur-0.08);g.gain.linearRampToValueAtTime(0.0001,when+dur);
  src.connect(lp).connect(g).connect(a.destination);src.start(when);src.stop(when+dur);
}
function strum(notes,when,dur){notes.forEach((m,i)=>pluck(m,when+i*0.028,dur,0.32));}

     <div class="stat"><b>${R.steady}%</b><small>stiprumo pastovumas</small></div>
     <div class="stat"><b>${R.missed}</b><small>praleisti tvaksniai</small></div>
     <div class="stat"><b>${R.harsh}</b><small>šiurkštūs braukimai</small></div></div>
     ${R.loud+R.soft?`<span class="muted" style="font-size:.88rem">Per stiprūs: ${R.loud}, per silpni: ${R.soft} (lyginant su ${R.calRef?"jūsų gitaros etalonu":"jūsų vidutiniu braukimu"}). Braukimo trukmė ~${R.rise} ms.</span>`:`<span class="muted" style="font-size:.88rem">Braukimo trukmė ~${R.rise} ms.</span>`}
     <ul class="tips">${R.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  return `${res}<span class="eyebrow">Tempas (bpm)</span><div class="row">${bp}</div><span class="eyebrow">Keisti akordą</span><div class="row">${pe}</div>
   <span class="muted" style="font-size:.88rem">Metronomas muša 4 įžangos tvaksnius, tada braukite žemyn ant kiekvieno tvaksnio ir keiskite akordą ties paryškintu tvaksniu. Programėlė matuoja, ar pataikote į tvaksnį, ar keitimai laiku, ar braukimai vienodo stiprumo ir ar neskamba šiurkščiai. Geriausiai veikia su ausinėmis.</span>`;
}
function rhyClick(t){
  if(t.dataset.cmode){rmCfg().mode=t.dataset.cmode;save();paintChg();return true;}
  if(t.dataset.rbpm){rmCfg().rbpm=+t.dataset.rbpm;save();paintChg();return true;}
  if(t.dataset.rper){rmCfg().rper=+t.dataset.rper;save();paintChg();return true;}
  return false;
}

function chgHtml(ex){
  if(RM.active&&RM.ex&&RM.ex.id===ex.id)return rhythmHtml(ex);
  if(CH2.active&&CH2.ex&&CH2.ex.id===ex.id)return chgSpeedHtml(ex);
  const c=rmCfg();
  const tabs=`<div class="row"><button class="btn small" data-cmode="speed" ${tog(c.mode==="speed")}>Greitis (1 min)</button><button class="btn small" data-cmode="rhythm" ${tog(c.mode==="rhythm")}>Ritmas ir braukimas</button></div>`;
  if(c.mode==="rhythm"){const pairs=ex.changes.map((p,i)=>`<button class="btn small" data-chp="${i}" data-chx="${ex.id}" ${tog(chgPair(ex)===p)}>${p.join(" ↔ ")}</button>`).join('');
    return tabs+`<span class="eyebrow">Akordų pora</span><div class="row">${pairs}</div>`+rhythmHtml(ex);}
  return tabs+(calReady()?"":`<span class="muted" style="font-size:.85rem">Patarimas: įrašykite <b>gitaros etaloną</b> (mygtukas viršuje), tada kokybė bus vertinama tiksliau.</span>`)+chgSpeedHtml(ex);
}

/* ---------- gitaros pritaikymas (kalibravimas) ---------- */
const CAL_STRINGS=[[6,40,"E"],[5,45,"A"],[4,50,"D"],[3,55,"G"],[2,59,"B"],[1,64,"E"]];
const CAL_CHORDS=["Em","Am","C","G","D","F","Bm"];
const CAL={active:false,step:null,target:null,got:[],pend:null,floor:[],lastOn:0,noiseAcc:[],msg:"",t0:0};
function calData(){if(!S.cal)S.cal={strings:{},chords:{}};return S.cal;}
function calReady(){const c=calData();return c.noise!=null&&Object.keys(c.chords).length>0;}
function ensureAnalysers(){
  const a=AC;if(!P.src)return;
  if(!P.an2){P.an2=a.createAnalyser();P.an2.fftSize=8192;P.an2.smoothingTimeConstant=0;P.src.connect(P.an2);P.fbuf=new Float32Array(P.an2.frequencyBinCount);}
  if(!P.anLow){const lp1=a.createBiquadFilter(),lp2=a.createBiquadFilter();lp1.type=lp2.type="lowpass";lp1.frequency.value=lp2.frequency.value=900;P.anLow=a.createAnalyser();P.anLow.fftSize=512;P.src.connect(lp1);lp1.connect(lp2);lp2.connect(P.anLow);P.lbuf=new Float32Array(512);}
}
function lowRms(){P.anLow.getFloatTimeDomainData(P.lbuf);let r=0;for(let i=0;i<512;i++)r+=P.lbuf[i]*P.lbuf[i];return Math.sqrt(r/512);}
function fullRms(){P.an.getFloatTimeDomainData(P.buf);let r=0;for(let i=0;i<P.buf.length;i++)r+=P.buf[i]*P.buf[i];return Math.sqrt(r/P.buf.length);}
async function calStart(step,target){
  if(CAL.active)calStop();
  Object.assign(CAL,{step,target,got:[],pend:null,floor:[],lastOn:0,noiseAcc:[],msg:"",t0:performance.now()});
  const ok=await micOn();if(!ok){renderCal();return;}ensureAnalysers();CAL.active=true;CAL.t0=performance.now();renderCal();
}
function calStop(){CAL.active=false;CAL.step=null;CAL.target=null;micOff();P.an2=null;P.anLow=null;}
function calFrame(){
  if(!P.anLow)return;const now=performance.now();const low=lowRms();
  if(CAL.step==="noise"){CAL.noiseAcc.push([fullRms(),low]);if(now-CAL.t0>2500){const f=CAL.noiseAcc.map(x=>x[0]).sort((a,b)=>a-b),l=CAL.noiseAcc.map(x=>x[1]).sort((a,b)=>a-b);const c=calData();c.noise=f[Math.floor(f.length*0.9)];c.noiseLow=l[Math.floor(l.length*0.9)];save();
    const loud=c.noise>0.02;calStop();CAL.msg=loud?"Aplinkoje gana triukšminga. Matavimai veiks, bet tyliau bus tiksliau.":"Tyla užfiksuota.";renderCal();}return;}
  const fl=CAL.floor;fl.push(low);if(fl.length>6)fl.shift();const floor=Math.min(...fl);
  if(CAL.pend){const p=CAL.pend;if(low>p.peak){p.peak=low;p.peakT=now;}const isS=CAL.step==="string";if(isS&&now>=p.t+150){P.an.getFloatTimeDomainData(P.buf);const ff=detectPitch(P.buf,AC.sampleRate);if(ff>0)(p.fs=p.fs||[]).push(ff);if(!p.ch){p.ch=chroma();p.br=brightness();}}if(now>=p.t+(isS?750:160)){CAL.pend=null;calStrum(p);}return;}
  const thr=Math.max(0.01,(calData().noiseLow||0)*3);
  if(low>thr&&low>floor*2&&now-CAL.lastOn>350){CAL.lastOn=now;CAL.pend={t:now,peak:low,peakT:now};}
}
function calStrum(p){
  const ch=p.ch||chroma();const br=p.br!=null?p.br:brightness();let f=-1;if(p.fs&&p.fs.length>=3)f=median(p.fs);else{P.an.getFloatTimeDomainData(P.buf);f=detectPitch(P.buf,AC.sampleRate);}
  const c=calData();
  if(CAL.step==="string"){
    const [sn,midi,nm]=CAL_STRINGS.find(x=>x[0]===CAL.target);
    if(f<0){CAL.msg="Nepavyko išgirsti aiškaus tono. Užgaukite stygą dar kartą ir leiskite skambėti.";renderCal();return;}
    const x=12*Math.log2(f/440)+69;let cents=Math.round((x-midi)*100);
    if(Math.abs(cents)>150&&Math.abs(cents-1200)<150)cents-=1200;
    if(Math.abs(cents)>50){const n=noteFromFreq(f);CAL.msg=`Girdžiu ${n.name}${n.oct}, o ${sn} styga turi būti ${nm}. Jei užgavote tinkamą stygą, ji stipriai išsiderinusi: pasiderinkite derintuvu ir pakartokite.`;renderCal();return;}
    c.strings[sn]={cents,peak:p.peak,br};save();
    CAL.msg=Math.abs(cents)<=12?`${sn} styga (${nm}) suderinta ir skamba gerai.`:`${sn} styga (${nm}) ${cents>0?"per aukštai":"per žemai"} ${Math.abs(cents)} centų. Pasiderinkite derintuvu ir pakartokite.`;
    const nxt=CAL_STRINGS.find(x=>!c.strings[x[0]]);calStop();CAL.msg2=nxt?`Toliau: ${nxt[0]} styga.`:"";renderCal();return;
  }
  if(CAL.step==="chord"){
    if(!ch){CAL.msg="Garsas per tylus. Braukite stipriau arba padėkite telefoną arčiau.";renderCal();return;}
    const g=judgeGeneric(ch,CAL.target);
    if(g.pur<0.55||g.miss.length){CAL.msg=g.miss.length?`Neskamba ${g.miss.join(", ")}. Patikrinkite pirštą, spaudžiantį šią natą, ir braukite dar kartą.`:"Akordas skamba neaiškiai. Pabandykite dar kartą, lėtai ir švariai.";renderCal();return;}
    CAL.got.push({ch:Array.from(ch),peak:p.peak,br,rise:Math.max(0,p.peakT-p.t)/1000});
    CAL.msg=`Švarus braukimas ${CAL.got.length} iš 3.`;
    if(CAL.got.length>=3){
      const G=CAL.got;const simAvg=G.map((x,i)=>G.reduce((a,y,j)=>a+(i===j?0:cosSim(x.ch,y.ch)),0)/2);const pk=G.map(x=>x.peak);const pmed=pk.slice().sort((a,b)=>a-b)[1];
      const worstS=simAvg.indexOf(Math.min(...simAvg));const worstP=pk.map(x=>Math.abs(Math.log(x/pmed))).reduce((bi,v,i,arr)=>v>arr[bi]?i:bi,0);
      if(Math.min(...simAvg)<0.9){G.splice(worstS,1);CAL.msg="Vienas braukimas skambėjo kitaip nei kiti, todėl jis atmestas. Perbraukite dar kartą taip pat, kaip ankstesnius.";renderCal();return;}
      if(Math.max(...pk)/Math.min(...pk)>1.6){G.splice(worstP,1);CAL.msg="Vienas braukimas buvo daug "+(pk[worstP]>pmed?"stipresnis":"silpnesnis")+" už kitus, todėl jis atmestas. Braukite savo įprastu stiprumu.";renderCal();return;}
      const t=new Array(12).fill(0);CAL.got.forEach(x=>x.ch.forEach((v,i)=>t[i]+=v/3));
      const avg=k=>CAL.got.reduce((a,x)=>a+x[k],0)/3;c.chords[CAL.target]={t,peak:avg("peak"),br:avg("br"),rise:avg("rise"),d:todayStr()};save();
      const nm=CAL.target;calStop();CAL.msg=`${nm} įrašytas kaip jūsų etalonas.`;}
    renderCal();
  }
}
function cosSim(a,b){let d=0,na=0,nb=0;for(let i=0;i<12;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return na&&nb?d/Math.sqrt(na*nb):0;}
function renderCal(){
  const v=document.getElementById("v-cal");if(!v)return;const c=calData();
  const strs=CAL_STRINGS.map(([sn,m,nm])=>{const r=c.strings[sn];const live=CAL.active&&CAL.step==="string"&&CAL.target===sn;
    return `<button class="btn small calb ${r?(Math.abs(r.cents)<=12?'okc':'warnc'):''} ${live?'live':''}" data-cals="${sn}">${sn} ${nm}${r?`<small>${r.cents>0?'+':''}${r.cents}¢</small>`:''}</button>`;}).join('');
  const chs=CAL_CHORDS.map(n=>{const r=c.chords[n];const live=CAL.active&&CAL.step==="chord"&&CAL.target===n;return `<button class="btn small calb ${r?'okc':''} ${live?'live':''}" data-calc="${n}">${n}${r?'<small>✓</small>':''}${live?`<small>${CAL.got.length}/3</small>`:''}</button>`;}).join('');
  const live=CAL.active?(CAL.step==="noise"?'Matuojama tyla… Nieko negrokite.':CAL.step==="string"?`Užgaukite ${CAL.target} stygą ir leiskite skambėti.`:`Braukite ${CAL.target} akordą švariai, po vieną braukimą. Reikia 3 švarių.`):'';
  v.innerHTML=`<div class="head"><span class="eyebrow">Gitaros pritaikymas</span><h1>Jūsų gitaros etalonas</h1><p class="muted">Įrašykite, kaip skamba jūsų gitara jūsų kambaryje. Vėliau visi pratimai lyginami su šiais įrašais, todėl matavimai tikslesni. Telefoną padėkite toje vietoje, kur jis bus pratybų metu.</p></div>
   ${live||CAL.msg?`<div class="note stack" style="gap:6px">${live?`<b>${live}</b>`:''}${CAL.msg?`<span>${esc(CAL.msg)}</span>`:''}${CAL.msg2&&!CAL.active?`<span class="muted">${esc(CAL.msg2)}</span>`:''}${CAL.active?'<button class="btn small" id="calCancel" style="align-self:flex-start">Atšaukti</button>':''}</div>`:''}
   <div class="theory" style="gap:10px"><h3>1. Tyla ${c.noise!=null?'<span class="pill">atlikta</span>':''}</h3><p class="muted">2,5 s išmatuojamas kambario triukšmas, kad programėlė neklaidintų jo su gitara.</p><button class="btn small" id="calNoise" style="align-self:flex-start">${c.noise!=null?'Matuoti iš naujo':'Matuoti tylą'}</button></div>
   <div class="theory" style="gap:10px"><h3>2. Atviros stygos</h3><p class="muted">Užgaukite kiekvieną stygą atskirai. Programėlė patikrins derinimą (¢ = centai, iki ±12 yra gerai) ir įsimins garsumą bei tembrą.</p><div class="row" style="justify-content:flex-start">${strs}</div></div>
   <div class="theory" style="gap:10px"><h3>3. Akordai</h3><p class="muted">Pasirinkite akordą ir 3 kartus švariai perbraukite normaliu stiprumu. Nešvarius braukimus programėlė atmes ir pasakys, kuri nata neskamba. Įrašykite tuos akordus, kuriuos jau mokate. Kitus įrašysite, kai išmoksite.</p><div class="row" style="justify-content:flex-start">${chs}</div></div>
   <p class="muted" style="font-size:.88rem">Kai gitara įrašyta, akordų keitimai lyginami su jūsų etalonu, o braukimai vertinami kaip „per stiprūs“ arba „per silpni“, lyginant su jūsų normaliu braukimu. Pasikeitus stygoms ar kambariui, verta įrašyti iš naujo.</p>
   <button class="btn" id="calBack" style="align-self:flex-start">Grįžti</button>`;
}
function calClick(t){
  if(t.id==="calNoise"){calStart("noise",null);return true;}
  if(t.dataset.cals){CAL.msg2="";calStart("string",+t.dataset.cals);return true;}
  if(t.dataset.calc){CAL.msg2="";calStart("chord",t.dataset.calc);return true;}
  if(t.id==="calCancel"){calStop();CAL.msg="";renderCal();return true;}
  if(t.id==="calOpen"){CAL.msg="";renderCal();show("cal");return true;}
  if(t.id==="calBack"){if(CAL.active)calStop();show("today");return true;}
  return false;
}

function renderAll(){renderToday();renderGoals();renderTheory();renderMetro();if(!P.round)renderEar();renderEarTrain();renderCal();}
function render(){renderAll();}
renderAll();
// refresh at midnight / when returning to the app
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!T.running){renderToday();}});
</script>
